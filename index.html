<style>
:root{
  --paper:#F4F4F1; --card:#FFFFFF; --sunk:#EBEBE6; --line:#DCDCD5; --line2:#C9C9C0;
  --ink:#16150F; --ink2:#4A4940; --ink3:#77766B;
  --brand:#F5C400; --brand-ink:#7A6100;
  --ok:#1F7A4D; --ok-bg:#E4F1E9; --warn:#A96A00; --warn-bg:#FBEEDA; --bad:#AA2A20; --bad-bg:#FBE6E4;
  --shadow:0 1px 2px rgba(20,19,15,.05), 0 8px 20px -14px rgba(20,19,15,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121210; --card:#1B1B18; --sunk:#232320; --line:#2E2E29; --line2:#3C3C35;
  --ink:#EFEEE7; --ink2:#B4B3A8; --ink3:#87867B;
  --brand:#F5C400; --brand-ink:#F5C400;
  --ok:#5FC08C; --ok-bg:#16301F; --warn:#E0A03A; --warn-bg:#332506; --bad:#F08C82; --bad-bg:#331714;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#121210; --card:#1B1B18; --sunk:#232320; --line:#2E2E29; --line2:#3C3C35;
  --ink:#EFEEE7; --ink2:#B4B3A8; --ink3:#87867B;
  --brand:#F5C400; --brand-ink:#F5C400;
  --ok:#5FC08C; --ok-bg:#16301F; --warn:#E0A03A; --warn-bg:#332506; --bad:#F08C82; --bad-bg:#331714;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.02em;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 72px}

/* ===================== GATE ===================== */
#gate{position:fixed;inset:0;z-index:99;background:#0A0A09;color:#EDEDE7;
  display:flex;align-items:center;justify-content:center;padding:24px;
  transition:opacity .55s ease, visibility .55s}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.gate-in{width:100%;max-width:420px;text-align:center}
.gate-eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#6F6E64;font-weight:600}
.gate-eyebrow b{background:var(--brand);color:#0A0A09;padding:1px 5px;border-radius:3px;letter-spacing:.1em}
#gate h1{font-size:31px;font-weight:800;margin:14px 0 0;color:#fff;letter-spacing:-.03em}
#gate p{margin:9px 0 0;color:#84837A;font-size:13.5px}

.stage{position:relative;height:230px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.ring{position:absolute;width:186px;height:186px;border:1px solid #2B2B27;border-radius:50%;
  opacity:0;transition:opacity .7s ease .1s}
.stage.intro .ring{opacity:1}
.ring::after{content:"";position:absolute;top:50%;left:50%;width:5px;height:5px;margin:-2.5px;
  background:#4A4A44;border-radius:50%}
.cells{display:flex;gap:14px;position:relative}
.cell{width:62px;height:74px;border-radius:17px;border:1.5px solid #33332E;background:#171715;
  display:flex;align-items:center;justify-content:center;
  font-family:Archivo;font-size:31px;font-weight:700;color:#fff;
  transition:transform .85s cubic-bezier(.22,1,.36,1), border-color .3s, box-shadow .3s, opacity .45s, background .3s}
.cell.on{border-color:#EDEDE7;box-shadow:0 0 0 1px #EDEDE7, 0 0 26px -4px rgba(237,237,231,.55)}
.stage.intro .cell:nth-child(1){transform:translate(2px,-104px)}
.stage.intro .cell:nth-child(2){transform:translate(78px,-24px) }
.stage.intro .cell:nth-child(3){transform:translate(-6px,58px)}
.stage.intro .cell:nth-child(4){transform:translate(-92px,6px)}
.stage.err .cells{animation:shake .42s}
.stage.err .cell{border-color:#C0554C;box-shadow:0 0 0 1px rgba(192,85,76,.5)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.stage.ok .cell{opacity:0;transform:scale(.5)}
.burst{position:absolute;width:150px;height:150px;opacity:0;transition:opacity .3s}
.stage.ok .burst{opacity:1}
.core{position:absolute;top:50%;left:50%;width:96px;height:96px;margin:-48px;border-radius:28px;
  border:2px solid #4FBF8B;transform:scale(.4);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s}
.core::after{content:"";position:absolute;inset:16px;border-radius:16px;background:#1B4634;border:1.5px solid #4FBF8B}
.stage.ok .core{transform:scale(1);opacity:1}
.spark{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;background:#6FD3A2;opacity:0}
.stage.ok .spark{animation:fly .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
 25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9)}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:262px;margin:4px auto 0}
.pad button{height:50px;border:1px solid #2B2B27;background:#151513;color:#EDEDE7;border-radius:12px;
  font:600 19px/1 "IBM Plex Mono";cursor:pointer;transition:background .15s}
.pad button:hover{background:#201F1D}
.pad button:active{background:#2A2926}
.pad button.wide{grid-column:span 1;font-size:14px;font-family:"IBM Plex Sans"}
.gate-msg{min-height:22px;margin-top:16px;font-size:13px;font-weight:600}
.gate-msg.bad{color:#E2887F}.gate-msg.good{color:#6FD3A2}
.gate-foot{margin-top:18px;font-size:11px;color:#5B5A52;line-height:1.5}

/* ===================== APP ===================== */
header{background:var(--ink);color:#F4F4F1;padding:18px 0 0}
.hrow{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-family:Archivo;font-weight:800;font-size:17px;letter-spacing:-.03em;line-height:1}
.mark b{background:var(--brand);color:#16150F;padding:1px 6px;border-radius:3px}
.mark small{display:block;font-size:9px;letter-spacing:.16em;font-weight:600;color:var(--brand);margin-top:5px;text-transform:uppercase;font-family:"IBM Plex Sans"}
.spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:#D9D8CF;font:600 12px/1 "IBM Plex Sans";padding:7px 11px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#16150F}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border-radius:20px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;color:#EDEDE7}
.userchip button{border:0;background:rgba(255,255,255,.12);color:#D9D8CF;border-radius:14px;padding:4px 9px;font:600 11px/1 "IBM Plex Sans";cursor:pointer}
.htitle{max-width:1120px;margin:0 auto;padding:22px 20px 20px}
.htitle h1{font-size:clamp(25px,4vw,37px);font-weight:800;color:#fff;line-height:1.03}
.htitle p{margin:8px 0 0;color:#A3A298;font-size:13.5px;max-width:62ch}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#A3A298;margin-top:12px;
  background:rgba(255,255,255,.07);padding:5px 10px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:#77766B;flex:none}
.dot.on{background:#5FC08C}.dot.off{background:#E0A03A}

section{margin-top:34px}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.shead h2{font-size:19px;font-weight:700}
.shead .hint{font-size:12.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.p18{padding:18px}

.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tcell{background:var(--card);padding:15px 16px 16px}
.tcell .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tcell .v{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:29px;font-weight:600;line-height:1.05;margin-top:7px}
.tcell .s{font-size:11.5px;color:var(--ink2);margin-top:4px}
.tcell.hero{background:var(--ink);color:#F4F4F1}
.tcell.hero .k{color:var(--brand)}.tcell.hero .s{color:#A3A298}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;align-items:end}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:5px}
input[type=number],input[type=date],input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:7px;
  background:var(--sunk);color:var(--ink);font:500 15px/1.2 "IBM Plex Mono";font-variant-numeric:tabular-nums}
input[type=date],select,input[type=text]{font-family:"IBM Plex Sans";font-size:13px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{border:0;border-radius:7px;padding:10px 16px;font:600 13px/1 "IBM Plex Sans";cursor:pointer;background:var(--brand);color:#16150F}
.btn:hover{filter:brightness(.94)}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{padding:6px 11px;font-size:12px}
.saved{font-size:12px;color:var(--ok);font-weight:600}

.prog{display:grid;gap:22px}
.prow{display:grid;grid-template-columns:112px 1fr 138px;gap:14px;align-items:center}
.prow .nm{font-weight:600;font-size:13.5px}
.prow .nm span{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.bar{height:24px;background:var(--sunk);border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px 0 0 4px;display:block}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.bar .tick::after{content:attr(data-l);position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font:600 9px/1 "IBM Plex Sans";color:var(--ink3);white-space:nowrap;letter-spacing:.04em}
.prow .fig{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.prow .fig span{display:block;font-size:11px;color:var(--ink3);font-weight:500;font-family:"IBM Plex Sans"}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font:600 11px/1.55 "IBM Plex Sans";white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-mut{background:var(--sunk);color:var(--ink3)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{background:var(--sunk);font:600 10.5px/1.4 "IBM Plex Sans";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr.now{background:rgba(245,196,0,.13)}
@supports (background:color-mix(in srgb,red 10%,transparent)){
  tbody tr.now{background:color-mix(in srgb,var(--brand) 12%,transparent)}
}
tbody tr.tot td{font-weight:700;background:var(--sunk);border-top:2px solid var(--line2)}
td.num{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
td input{width:76px;padding:5px 7px;font-size:13px;text-align:right}
.minibar{display:inline-block;width:52px;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:7px;border:1px solid var(--line)}
.minibar i{display:block;height:100%}

.wk h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);font-weight:700;
  padding:16px 0 9px;border-bottom:1px solid var(--line);margin-bottom:2px}
.task{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--brand);cursor:pointer;flex:none}
.task input[type=checkbox]:disabled{cursor:not-allowed;opacity:.45}
.task .d{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--ink3);flex:none;width:48px;padding-top:3px}
.task .t{flex:1;font-size:13.5px;min-width:180px}
.task.done .t{color:var(--ink3);text-decoration:line-through}
.task.miss{background:rgba(170,42,32,.06)}
.task .meta{flex:none;display:flex;gap:6px;align-items:center;padding-top:1px}
.task.weekly .t::before{content:"↻ ";color:var(--brand-ink);font-weight:700}
.hbtn{font:600 11px/1.5 "IBM Plex Sans";padding:3px 9px;border-radius:20px;border:1px solid var(--line2);
  background:transparent;color:var(--brand-ink);cursor:pointer;white-space:nowrap}
.hbtn:hover{background:var(--sunk)}
.how{margin:0 4px 12px 59px;padding:12px 14px;background:var(--sunk);border-left:3px solid var(--brand);
  border-radius:0 9px 9px 0;font-size:12.5px;line-height:1.62;color:var(--ink2)}
.newtask{background:var(--sunk);border:1px dashed var(--line2);border-radius:11px;padding:15px;margin-bottom:18px}
.newtask textarea{width:100%;min-height:66px;font-size:13px;line-height:1.5}
.pinv{font-family:"IBM Plex Mono";font-size:13.5px;font-weight:600;letter-spacing:.16em;min-width:56px;
  display:inline-block;text-align:center;color:var(--ink)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font:600 10.5px/1.6 "IBM Plex Sans";
  background:var(--sunk);color:var(--ink3);white-space:nowrap}
@media(max-width:640px){.how{margin-left:4px}}
#pwa[hidden],#callw[hidden]{display:none!important}
#pwa{position:fixed;inset:0;background:rgba(20,19,14,.55);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:90;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:16px;padding:22px;max-width:430px;width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,.28)}
.mtop{display:flex;gap:11px;align-items:center;margin-bottom:6px}
.mico{font-size:26px;line-height:1}
.modal h3{font-size:17px;font-weight:700;margin:0}
.msub{font-size:13px;color:var(--ink3);margin:0 0 14px;line-height:1.55}
.msteps{margin:0 0 18px;padding-left:20px;font-size:13.5px;line-height:1.75}
.msteps li{margin-bottom:5px}
.mbtns{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
#callw{position:fixed;inset:0;background:var(--paper);z-index:95;overflow:auto}
.ovbar{position:sticky;top:0;display:flex;gap:12px;align-items:center;padding:13px 18px;
  background:var(--card);border-bottom:1px solid var(--line);font-size:14px;z-index:2}
.ovbar .grow{flex:1}
.ovbody{padding:18px;max-width:720px;margin:0 auto}
.csimp{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px}
.csimp h3{font-size:15px;font-weight:700;margin:0 0 4px}
.csprog{font:600 12px/1.6 "IBM Plex Mono";color:var(--ink3);margin-bottom:10px;text-align:center}
.cscard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px}
.csname{font-size:22px;font-weight:700;line-height:1.2}
.csmeta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 14px}
.csact{display:flex;gap:9px;flex-wrap:wrap}
.csact .btn{text-decoration:none;display:inline-flex;align-items:center}
.scbox{margin-top:14px}
.scT{font:700 11px/1.6 "IBM Plex Sans";letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.scbox textarea{width:100%;min-height:96px;font-size:13px;line-height:1.55}
.libsel{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.libsel label{font:700 10.5px/1.6 "IBM Plex Sans";letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:block}
.libsel select{min-width:150px}
.csre{margin-top:16px}
.csrb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rbtn{display:flex;gap:7px;align-items:center;justify-content:center;padding:12px 10px;border-radius:11px;
  border:2px solid var(--line2);background:var(--card);cursor:pointer;font:600 13px/1.3 "IBM Plex Sans";color:var(--ink)}
.rbtn:hover{background:var(--sunk)}
.dotc{width:9px;height:9px;border-radius:50%;flex:none}
.csnav{display:flex;justify-content:space-between;margin-top:16px}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lrnbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin:4px 0 14px}
.lrnpill{display:flex;gap:7px;align-items:center;background:var(--sunk);border-radius:9px;padding:8px 10px;font-size:12px}
.lrnpill b{margin-left:auto;font-family:"IBM Plex Mono";font-size:14px}
.adv{background:var(--sunk);border-left:3px solid var(--brand);border-radius:0 9px 9px 0;
  padding:12px 14px;font-size:13px;line-height:1.6;color:var(--ink2)}

.who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.av{width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font:700 9.5px/1 "IBM Plex Sans";color:#16150F;flex:none}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.corr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.corr:last-child{border-bottom:0}
.corr .v{font-family:"IBM Plex Mono";font-weight:600;font-size:13px}
.note{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.5}
.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.score{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--card)}
.score .n{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.score .b{font-family:"IBM Plex Mono";font-size:22px;font-weight:600;margin-top:6px}
.score .s{font-size:11.5px;color:var(--ink3)}

/* admin */
.ah{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);font-weight:700;margin-bottom:12px}

.urow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

.ctrl{display:flex;gap:9px;flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line2))}

.dz-t{font:700 13px/1.2 "IBM Plex Sans";color:var(--bad)}
.dz-d{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.btn.danger-btn{background:var(--bad);color:#fff}
/* recap */
.rcbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rcbar select{width:auto;min-width:170px}
textarea{width:100%;min-height:110px;padding:12px 13px;border:1px solid var(--line2);border-radius:9px;

textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.mic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--sunk);
  color:var(--ink);border-radius:22px;padding:8px 15px;font:600 13px/1 "IBM Plex Sans";cursor:pointer}
.mic .rec{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.mic.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.mic.on .rec{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.rcpost{border-left:2.5px solid var(--line2);padding:2px 0 2px 14px;margin:16px 0}
.rcpost .hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.rcpost .tx{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.rcday{font:700 11px/1 "IBM Plex Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);

.log{max-height:420px;overflow-y:auto}
.logrow{display:flex;gap:11px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.logrow:last-child{border-bottom:0}
.logrow .ts{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink3);flex:none;width:96px}
.logrow .tx{flex:1;color:var(--ink2)}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.6}

const TASKS=[
 {w:1,d:"03.09",fr:"Diagnostic Ria : tester le terminal, vérifier les taux, les corridors et le code CH1334",es:"Diagnóstico Ria: probar el terminal, verificar tasas, corredores y el código CH1334",hf:"Faire deux envois test de 20 CHF (Portugal, Togo). Noter le taux affiché et le comparer sur place à Western Union et MoneyTrans. Vérifier que le code CH1334 sort sur le reçu. Si un corridor est refusé, photographier l'écran et l'envoyer le jour même à la centrale.",hs:"Hacer dos envíos de prueba de 20 CHF (Portugal, Togo). Anotar la tasa y compararla en el momento con Western Union y MoneyTrans. Comprobar que el código CH1334 sale en el recibo. Si un corredor se rechaza, fotografiar la pantalla y mandarla el mismo día a la central."},
 {w:1,d:"03.09",fr:"Imprimer et poser les flyers Capital Visa à chaque guichet (FR / DE / ES / IT)",es:"Imprimir y colocar los flyers Capital Visa en cada guichet (FR / DE / ES / IT)",hf:"Imprimer en A4 couleur : FR et DE au guichet 1, ES et IT au guichet 2. Un présentoir face au client, pas à côté de la caisse. Un exemplaire sur la porte d'entrée. Remplacer dès qu'un flyer est sale. Photo du montage envoyée à l'administration.",hs:"Imprimir en A4 color: FR y DE en el guichet 1, ES e IT en el guichet 2. Un expositor mirando al cliente, no al lado de la caja. Un ejemplar en la puerta de entrada. Cambiarlo en cuanto se ensucie. Foto del montaje a administración."},
 {w:1,d:"03.09",fr:"Afficher les objectifs quotidiens au guichet, visibles par toute l'équipe",es:"Colocar los objetivos diarios en el guichet, visibles para todo el equipo",hf:"Reprendre les trois chiffres de la section « Objectifs d'aujourd'hui » de cette application et les écrire au feutre sur le tableau, en gros. Les réécrire chaque matin à l'ouverture, avec le chiffre de la veille à côté pour comparer.",hs:"Coger las tres cifras de la sección «Objetivos de hoy» de esta aplicación y escribirlas con rotulador en la pizarra, en grande. Reescribirlas cada mañana al abrir, con la cifra del día anterior al lado para comparar."},
 {w:1,d:"03.09",fr:"Briefing équipe : chaque transaction finit par une carte Visa proposée et un avis Google demandé",es:"Briefing equipo: cada transacción termina con una tarjeta Visa ofrecida y una reseña Google pedida",hf:"10 minutes avant l'ouverture. Deux phrases à dire à chaque client : « Vous voulez une carte Visa pour recevoir votre salaire ? » et « Si vous êtes content, laissez-nous un avis Google, ça prend 20 secondes ». Chacun note le soir combien de cartes il a proposées.",hs:"10 minutos antes de abrir. Dos frases para decir a cada cliente: «¿Quiere una tarjeta Visa para recibir su salario?» y «Si está contento, déjenos una reseña en Google, son 20 segundos». Cada uno anota por la tarde cuántas tarjetas ofreció."},
 {w:1,d:"03.09",fr:"Envoyer à la centrale les 3 questions (comptage MG, objectif Ria juillet, volumes réels 2025)",es:"Enviar a la central las 3 preguntas (conteo MG, objetivo Ria julio, volúmenes reales 2025)",hf:"Un seul e-mail, trois questions numérotées : 1) MoneyGram, envois seuls ou envois + paiements pour l'objectif ? 2) Objectif Ria juillet : 559 (RH) ou 580 (lettre) ? 3) Volumes réels Mercury de janvier à juin. Demander une réponse écrite et garder le fil.",hs:"Un solo correo, tres preguntas numeradas: 1) MoneyGram, ¿solo envíos o envíos + pagos para el objetivo? 2) Objetivo Ria julio: ¿559 (RRHH) o 580 (carta)? 3) Volúmenes reales de Mercury de enero a junio. Pedir respuesta por escrito y guardar el hilo."},
 {w:1,d:"04.09",fr:"Appeler les 8 premiers clients perdus de la liste Excel",es:"Llamar a los 8 primeros clientes perdidos de la lista Excel",hf:"Ouvrir la liste Excel, trier par date du dernier envoi. Appeler en fin de matinée ou après 17 h. Ouverture : « Bonjour, c'est Capital Services Bienne, on ne vous a plus vu depuis mars, tout va bien ? » Écouter la raison et la noter. Si c'est le taux, proposer de rappeler dès qu'il bouge.",hs:"Abrir la lista Excel, ordenar por fecha del último envío. Llamar a media mañana o después de las 17 h. Apertura: «Buenos días, es Capital Services Bienne, no le vemos desde marzo, ¿todo bien?» Escuchar el motivo y anotarlo. Si es la tasa, ofrecer volver a llamar en cuanto cambie."},
 {w:1,d:"04.09",fr:"Sortir la liste des clients Mercury Kenya et Sénégal",es:"Sacar la lista de clientes Mercury Kenia y Senegal",hf:"Sortir de Mercury la liste des clients qui envoyaient vers le Kenya et le Sénégal en 2025 et plus rien en 2026. Coller dans l'Excel : nom, téléphone, dernier envoi, montant habituel. C'est la liste d'appels des deux semaines suivantes.",hs:"Sacar de Mercury la lista de clientes que enviaban a Kenia y Senegal en 2025 y nada en 2026. Pegarla en el Excel: nombre, teléfono, último envío, importe habitual. Esa es la lista de llamadas de las dos semanas siguientes."},
 {w:1,d:"05.09",fr:"Samedi : pression maximale au guichet, carte Visa proposée à tous",es:"Sábado: máxima presión en el guichet, tarjeta Visa ofrecida a todos",hf:"Le samedi fait le tiers de la semaine. Les deux caissiers au guichet, pas de tâche administrative. Carte Visa proposée à tout le monde, sans exception. Avis Google demandé à chaque client qui repart content. Chiffres saisis le soir même.",hs:"El sábado hace un tercio de la semana. Los dos cajeros en el guichet, nada de trabajo administrativo. Tarjeta Visa ofrecida a todo el mundo, sin excepción. Reseña de Google pedida a cada cliente que se va contento. Cifras metidas esa misma tarde."},
 {w:1,d:"05.09",wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)",hf:"Le samedi avant l'ouverture ou après la fermeture. Vitrine extérieure, porte et plaque d'enseigne. Raclette et produit, pas de chiffon sec. Une vitrine sale fait perdre des clients avant même qu'ils entrent.",hs:"El sábado antes de abrir o después de cerrar. Escaparate exterior, puerta y placa del rótulo. Rasqueta y producto, nada de trapo seco. Un escaparate sucio pierde clientes antes de que entren."},
 {w:2,d:"07.09",fr:"Appels Mercury Kenya (−215 opérations)",es:"Llamadas Mercury Kenia (−215 operaciones)",hf:"215 opérations perdues : c'est le plus gros trou de l'année. Prendre la liste sortie le 4 et appeler 15 personnes dans la journée. Question clé : « Vous envoyez toujours au Kenya ? Par qui ? » Noter le concurrent et son taux : c'est la preuve à envoyer à la direction.",hs:"215 operaciones perdidas: es el agujero más grande del año. Coger la lista del día 4 y llamar a 15 personas en el día. Pregunta clave: «¿Sigue enviando a Kenia? ¿Con quién?» Anotar el competidor y su tasa: es la prueba que hay que mandar a dirección."},
 {w:2,d:"08.09",fr:"Appels Mercury Sénégal (−160) + relevé des taux Western Union, Ria, MoneyTrans",es:"Llamadas Mercury Senegal (−160) + toma de tasas Western Union, Ria, MoneyTrans",hf:"Le matin, 15 appels Sénégal. L'après-midi, relever les taux affichés chez Western Union, Ria et MoneyTrans à Bienne pour les cinq corridors qui baissent. Photo de chaque affichage, avec la date. Sans preuve, la demande de meilleur taux ne passera pas.",hs:"Por la mañana, 15 llamadas a Senegal. Por la tarde, anotar las tasas expuestas en Western Union, Ria y MoneyTrans en Bienne para los cinco corredores que caen. Foto de cada cartel, con la fecha. Sin pruebas, la petición de mejor tasa no pasa."},
 {w:2,d:"09.09",fr:"Appels Ria Togo (−67 %) et Guinée (−56 %)",es:"Llamadas Ria Togo (−67 %) y Guinea (−56 %)",hf:"Togo −67 % et Guinée −56 % : ce sont des baisses de taux, pas des clients partis. Appeler et demander franchement : « On a vu que vous n'envoyez plus, c'est le taux ? » Si oui, noter le montant habituel — ça chiffre la perte pour la direction.",hs:"Togo −67 % y Guinea −56 %: son bajadas de tasa, no clientes que se han ido. Llamar y preguntar claro: «Hemos visto que ya no envía, ¿es por la tasa?» Si es que sí, anotar el importe habitual — eso pone cifras a la pérdida para dirección."},
 {w:2,d:"10.09",fr:"Appels Ria Portugal (−58 %) — 3e nationalité du canton, plus gros gisement",es:"Llamadas Ria Portugal (−58 %) — 3ª nacionalidad del cantón, mayor bolsa",hf:"Le portugais est la 3e nationalité du canton : c'est le plus gros gisement de la liste. Appeler, mais aussi passer dans les cafés et restaurants portugais avec des flyers. Demander à parler au patron, pas au serveur.",hs:"El portugués es la 3ª nacionalidad del cantón: es la bolsa más grande de la lista. Llamar, pero también pasar por los cafés y restaurantes portugueses con flyers. Pedir hablar con el dueño, no con el camarero."},
 {w:2,d:"11.09",fr:"Clôturer les 22 fiches clients perdus dans l'Excel",es:"Cerrar las 22 fichas de clientes perdidos en el Excel",hf:"Chaque fiche doit finir avec une des quatre réponses : revient, ne revient pas, à rappeler, injoignable. Une fiche sans réponse ne sert à rien. Les « à rappeler » partent dans l'agenda de la semaine du 21.",hs:"Cada ficha tiene que acabar con una de cuatro respuestas: vuelve, no vuelve, volver a llamar, ilocalizable. Una ficha sin respuesta no sirve de nada. Los «volver a llamar» se pasan a la agenda de la semana del 21."},
 {w:2,d:"12.09",fr:"Envoyer le comparatif des taux à la direction, avec preuves",es:"Enviar el comparativo de tasas a la dirección, con pruebas",hf:"Un tableau simple : corridor, notre taux, taux du concurrent, écart, nombre de clients perdus. Les photos en pièce jointe. Terminer par une demande précise, pas générale : « sur ces cinq corridors, il nous faut X ». Copie à l'administration.",hs:"Una tabla sencilla: corredor, nuestra tasa, tasa del competidor, diferencia, número de clientes perdidos. Las fotos adjuntas. Terminar con una petición concreta, no general: «en estos cinco corredores necesitamos X». Copia a administración."},
 {w:2,d:"12.09",wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)",hf:"Le samedi avant l'ouverture ou après la fermeture. Vitrine extérieure, porte et plaque d'enseigne. Raclette et produit, pas de chiffon sec.",hs:"El sábado antes de abrir o después de cerrar. Escaparate exterior, puerta y placa del rótulo. Rasqueta y producto, nada de trapo seco."},
 {w:3,d:"14.09",fr:"Préparer la liste : 15 commerces communautaires + 12 entreprises cibles",es:"Preparar la lista: 15 comercios comunitarios + 12 empresas objetivo",hf:"Commerces : épiceries africaines et latinos, boutiques de téléphonie, coiffeurs, restaurants. Entreprises : construction, nettoyage, travail temporaire — celles qui emploient des étrangers. Pour chacune : nom, adresse, nom du patron si connu. La liste se prépare la veille.",hs:"Comercios: tiendas africanas y latinas, locutorios, peluquerías, restaurantes. Empresas: construcción, limpieza, trabajo temporal — las que emplean extranjeros. De cada una: nombre, dirección, nombre del dueño si se sabe. La lista se prepara la víspera."},
 {w:3,d:"15.09",fr:"Tournée terrain A : commerces africains et latinos, boutiques téléphonie, salons de coiffure",es:"Ruta terreno A: comercios africanos y latinos, locutorios, peluquerías",hf:"Y aller entre 14 h et 16 h, jamais à l'heure du repas. Demander le patron, se présenter en 20 secondes, laisser un présentoir de flyers sur le comptoir et repartir. Ne pas vendre sur place : le but est que les flyers restent. Noter qui a accepté.",hs:"Ir entre las 14 h y las 16 h, nunca a la hora de comer. Preguntar por el dueño, presentarse en 20 segundos, dejar un expositor de flyers en el mostrador y marcharse. No vender allí: el objetivo es que los flyers se queden. Anotar quién aceptó."},
 {w:3,d:"16.09",fr:"Tournée entreprises A : 6 sociétés (construction, nettoyage, temporaire)",es:"Ruta empresas A: 6 sociedades (construcción, limpieza, temporales)",hf:"Demander le responsable RH ou le patron. Argument : « vos employés étrangers envoient de l'argent et ouvrent des comptes — on peut le faire pour tout le monde, sur place, en une matinée ». Laisser une carte et un flyer, et proposer une date.",hs:"Pedir el responsable de RRHH o el dueño. Argumento: «sus empleados extranjeros envían dinero y abren cuentas — podemos hacerlo para todos, allí mismo, en una mañana». Dejar una tarjeta y un flyer, y proponer una fecha."},

const TASKS_SEP = TASKS;
function weekOf(y,m,d){ const first=new Date(y,m,1).getDay(); return Math.floor((d + ((first+6)%7) - 1)/7)+1; }
function weekRange(y,m,w){
  const dim=new Date(y,m+1,0).getDate(); let a=null,b=null;
  for(let d=1;d<=dim;d++){ if(weekOf(y,m,d)===w){ if(a===null)a=d; b=d; } }
  return [a,b];
}
function tasksFor(m){
  if(m===8) return TASKS_SEP;
  const dim=new Date(YEAR,m+1,0).getDate(), out=[];
  const lbl=d=>pad2(d)+"."+pad2(m+1);
  let firstOpen=null,lastOpen=null,mid=null;
  for(let d=1;d<=dim;d++){ const dow=new Date(YEAR,m,d).getDay(); if(dow===0)continue;
    if(firstOpen===null)firstOpen=d; lastOpen=d; if(d<=15)mid=d; }
  for(let d=1;d<=dim;d++){
    const dt=new Date(YEAR,m,d), dow=dt.getDay(); if(dow===0) continue;
    const w=weekOf(YEAR,m,d);
    if(d===firstOpen) out.push({w:w,d:lbl(d),fr:"Afficher les objectifs du mois au guichet",es:"Colocar los objetivos del mes en el guichet",hf:"Reprendre les trois chiffres de la section « Objectifs d'aujourd'hui » et les écrire au feutre sur le tableau, en gros, visibles par toute l'équipe.",hs:"Coger las tres cifras de la sección «Objetivos de hoy» y escribirlas con rotulador en la pizarra, en grande, visibles para todo el equipo."});
    if(dow===1) out.push({w:w,d:lbl(d),fr:"Point hebdomadaire : où en sont Mercury, MoneyGram et Ria",es:"Punto semanal: dónde están Mercury, MoneyGram y Ria",hf:"Cinq minutes le lundi matin. Ouvrir « Comment va le mois » : quel système est en retard, combien il manque par jour, qui fait quoi cette semaine.",hs:"Cinco minutos el lunes por la mañana. Abrir «Cómo va el mes»: qué sistema va con retraso, cuánto falta por día, quién hace qué esta semana."});
    if(d===mid) out.push({w:w,d:lbl(d),fr:"Bilan de mi-mois et rattrapage si nécessaire",es:"Balance de mitad de mes y recuperación si hace falta",hf:"Sous 45 % à la moitié du mois, un système ne se rattrape pas tout seul. Décider ce jour-là où va l'effort des deux semaines restantes et l'écrire dans le bilan du jour.",hs:"Por debajo del 45 % a mitad de mes, un sistema no se recupera solo. Decidir ese día dónde va el esfuerzo de las dos semanas que quedan y escribirlo en el balance del día."});
    if(dow===6) out.push({w:w,d:lbl(d),wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)"});
    if(d===lastOpen){
      out.push({w:w,d:lbl(d),fr:"Clôture du mois : chiffres par système et compte rendu",es:"Cierre de mes: cifras por sistema e informe",hf:"Trois chiffres par système arrêtés le dernier jour ouvré, puis compte rendu court : ce qui a marché, ce qui a bloqué, ce qu'il faut de la centrale pour le mois suivant.",hs:"Tres cifras por sistema cerradas el último día laborable, y después informe corto: lo que ha funcionado, lo que se ha atascado, lo que hace falta de la central para el mes siguiente."});
      out.push({w:w,d:lbl(d),fr:"Importer les rapports Excel du mois (MoneyGram et Ria)",es:"Importar los informes Excel del mes (MoneyGram y Ria)",hf:"Télécharger le rapport détaillé MoneyGram et le rapport de transactions Ria, puis les déposer dans « Importer un rapport » en haut de la page : les chiffres se répartissent seuls par caissier et par jour.",hs:"Descargar el informe detallado de MoneyGram y el informe de transacciones de Ria, y soltarlos en «Importar un informe» arriba de la página: las cifras se reparten solas por cajero y por día."});
    }
  }
  out.sort((a,b)=>a.d.localeCompare(b.d));
  return out;
}
function weeksFor(m){
  if(m===8) return WEEKS;
  const o={}, ws=new Set(tasksFor(m).map(t=>t.w));
  ws.forEach(w=>{ const [a,b]=weekRange(YEAR,m,w);
    o[w]={fr:"Semaine du "+a+" au "+b+" "+T.fr.monthN[m].toLowerCase(),
          es:"Semana del "+a+" al "+b+" de "+T.es.monthN[m].toLowerCase()}; });
  return o;
}

function curTotals(){const o={mercury:START.mercury,mgEnv:START.mgEnv,mgPay:START.mgPay,ria:START.ria,visa:START.visa,avis:START.avis};
  const p=YEAR+"-"+pad2(CUR+1)+"-";

    o.mercury+=+v.mercury||0;o.mgEnv+=+v.mgEnv||0;o.mgPay+=+v.mgPay||0;o.ria+=+v.ria||0;o.visa+=+v.visa||0;o.avis+=+v.avis||0;}
  return o;}
function uidOfKey(k){const i=k.indexOf("_");return i<0?"":k.slice(i+1);}
function byUser(){
  const p=YEAR+"-"+pad2(CUR+1)+"-", out={};
  USERS.forEach(u=>{out[u.id]={mercury:0,mgEnv:0,mgPay:0,ria:0,visa:0,avis:0,jours:0};});
  out.__={mercury:0,mgEnv:0,mgPay:0,ria:0,visa:0,avis:0,jours:0};
  for(const k in jours){ if(!k.startsWith(p)) continue;
    const uid=uidOfKey(k)||"__", v=jours[k]||{};
    if(!out[uid]||typeof out[uid]!=="object") out[uid]={mercury:0,mgEnv:0,mgPay:0,ria:0,visa:0,avis:0,jours:0};
    const o=out[uid];
    o.mercury+=+v.mercury||0;o.mgEnv+=+v.mgEnv||0;o.mgPay+=+v.mgPay||0;
    o.ria+=+v.ria||0;o.visa+=+v.visa||0;o.avis+=+v.avis||0;o.jours+=1; }
  return out;
}
function realOf(sys,i){const k=YEAR+"-"+pad2(i+1);
  if(mois[k]&&mois[k][sys]!=null&&mois[k][sys]!=="")return +mois[k][sys];
  if(i===CUR){const c=curTotals();return sys==="mercury"?c.mercury:sys==="mg"?c.mgEnv:c.ria;}
  return REAL0[sys][i];}
function cumul(s){let x=0;for(let i=0;i<12;i++){const v=realOf(s,i);if(v!=null)x+=v;}return x;}
function knownMonths(s){let n=0;for(let i=0;i<12;i++)if(realOf(s,i)!=null)n++;return n;}

async function logIt(action,detail){
  if(!ME)return;
  const day=todayISO(), key=day+"_"+ME.id;
  const cur=(journal[key]&&Array.isArray(journal[key].entries))?journal[key].entries.slice():[];
  cur.push({ts:new Date().toISOString(),a:action,d:detail||""});
  const rec={user:ME.id,name:ME.name,day:day,entries:cur.slice(-400)};
  journal[key]=rec;
  if(DB){try{await DB.doc("journal/"+key).set(rec);}catch(e){}} else saveLocal();
  renderLog();
}
function allEntries(){
  const out=[];
  for(const k in journal){const j=journal[k]; if(!j||!Array.isArray(j.entries))continue;
    j.entries.forEach(e=>out.push({u:j.user,n:j.name,ts:e.ts,a:e.a,d:e.d}));}
  out.sort((a,b)=>b.ts.localeCompare(a.ts)); return out;
}

  if(k==="B"){buf=buf.slice(0,-1);paintCells();return;}
  if(!/^[0-9]$/.test(k)||buf.length>=4)return;
  buf+=k; paintCells();
  if(buf.length===4) setTimeout(tryPin,180);
}
function tries(){ try{return JSON.parse(localStorage.getItem("cs-try")||"{}");}catch(e){return {};} }
function setTries(o){ try{localStorage.setItem("cs-try",JSON.stringify(o));}catch(e){} }
async function tryPin(){
  const st=document.getElementById("stage"), msg=document.getElementById("g-msg");
  const tr=tries();
  if(tr.until&&Date.now()<tr.until){
    const s=Math.ceil((tr.until-Date.now())/1000);
    msg.className="gate-msg bad"; msg.textContent=t().glock.replace("{s}",s);
    buf=""; paintCells(); return;
  }
  const hv=await sha(SALT+buf);
  const u=USERS.find(x=>x.h===hv);
  if(!u){
    const n=(tr.n||0)+1, o={n:n};
    if(n>=MAXTRY){o.until=Date.now()+LOCKMS;o.n=0;}
    setTries(o);
    st.classList.add("err"); msg.className="gate-msg bad";
    msg.textContent=n>=MAXTRY?t().glock.replace("{s}",Math.round(LOCKMS/1000))
      :t().gbad+" ("+(MAXTRY-n)+")";
    buf=""; setTimeout(()=>{paintCells();st.classList.remove("err");},450); return; }
  setTries({});
  ME=u; msg.className="gate-msg good"; msg.textContent=t().gwelcome+", "+u.name;
  const burst=document.getElementById("burst"); burst.innerHTML="";
  for(let i=0;i<16;i++){const s=document.createElement("span");s.className="spark";
    const a=Math.random()*Math.PI*2, r=46+Math.random()*54;
    s.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    s.style.setProperty("--dy",(Math.sin(a)*r).toFixed(1)+"px");
    s.style.animationDelay=(Math.random()*.16).toFixed(2)+"s";
    s.style.width=s.style.height=(4+Math.random()*4).toFixed(1)+"px";
    if(i%4===0)s.style.background="#E9F7F0";
    burst.appendChild(s);}
  st.classList.add("ok");
  setTimeout(()=>{
    document.getElementById("gate").classList.add("gone");
    document.getElementById("app").hidden=false;
    try{sessionStorage.setItem("cs-me",u.id);}catch(e){}
    if(!DB){ loadLocal(); seedOnce(); }
    renderAll(); renderEntry(); logIt("login","");
    setTimeout(()=>{try{showInstall(false);}catch(e){}},2200);
  },1150);
}

async function findPin(h){
  for(let b=0;b<10000;b+=500){
    const jobs=[];
    for(let i=b;i<Math.min(b+500,10000);i++){
      const p=String(i).padStart(4,"0");
      jobs.push(sha(SALT+p).then(x=>x===h?p:null));
    }
    const hit=(await Promise.all(jobs)).find(Boolean);
    if(hit) return hit;
  }
  return null;
}

/* ===== Import des rapports Excel (MoneyGram / Ria) ===== */
const MONTHS={jan:1,janv:1,feb:2,fev:2,"f\u00e9v":2,"f\u00e9vr":2,mar:3,mars:3,apr:4,avr:4,may:5,mai:5,
  jun:6,juin:6,jul:7,juil:7,aug:8,"ao\u00fb":8,aout:8,"ao\u00fbt":8,sep:9,sept:9,oct:10,nov:11,dec:12,"d\u00e9c":12};
function parseDate(v){
  if(v==null)return null; const s=String(v).trim();
  let m=s.match(/^(\d{4})-([A-Za-z\u00C0-\u00FF]+)-(\d{1,2})/);
  if(m){ const mm=MONTHS[m[2].toLowerCase().replace(/\.$/,"")]; if(mm) return m[1]+"-"+pad2(mm)+"-"+pad2(+m[3]); }
  m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  if(m) return m[3]+"-"+pad2(+m[2])+"-"+pad2(+m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  return null;
}
function opMap(){ const o={}; USERS.forEach(u=>{ if(u.opid) o[String(u.opid).toLowerCase()]=u.id; }); return o; }

function analyseRows(rows){
  const flat=rows.map(r=>r.map(c=>c==null?"":String(c)));
  const join=flat.map(r=>r.join(" | "));
  const ops=opMap();
  // --- Ria : rapport résumé
  const riaHead=join.findIndex(l=>/rapport de transaction/i.test(l));
  if(riaHead>-1){
    let env=0,pay=0,per=null;
    flat.forEach(r=>{
      const a=(r[0]||"");
      if(/Envoi/i.test(a)&&/Transfert/i.test(a)) env+=parseInt(String(r[1]).replace(/\D/g,""),10)||0;
      if(/Paiement/i.test(a)&&/Transfert/i.test(a)) pay+=parseInt(String(r[1]).replace(/\D/g,""),10)||0;
      const p=(r[0]||"").match(/P.riode\s*:\s*([\d./]+)\s*-\s*([\d./]+)/);
      if(p) per=[parseDate(p[1]),parseDate(p[2])];
    });
    if(env||pay){
      const d=(per&&per[1])||todayISO();
      return {type:"Ria", periode:per, lignes:[{key:d, uid:"", label:t().unassigned, ria:env, note:"Ria "+(per?per[0]+" → "+per[1]:"")}], total:{ria:env, riaPay:pay}};
    }
  }
  // --- MoneyGram : rapport détaillé
  let sec=null; const acc={}; const unknown={};
  flat.forEach(r=>{
    const l=r.join(" ").toUpperCase();
    if(/D.TAILS DES ENVOIS/.test(l)) sec="mgEnv";
    else if(/D.TAILS DES R.CEPTIONS/.test(l)) sec="mgPay";
    else if(/D.TAILS DU REMBOURSEMENT/.test(l)) sec="skip";
    else if(/R.CAPITULATIF|R.SUM. DE LA P.RIODE|TOTAL G.N.RAL/.test(l)) sec=null;
    if(!sec||sec==="skip") return;
    let d=null,uid=null,raw=null;
    r.forEach(c=>{ const p=parseDate(c); if(p&&/\d{1,2}:\d{2}/.test(String(c))) d=p;
      const k=String(c).trim().toLowerCase();
      if(/^[a-z]{4,6}\d{3,4}$/.test(k)){ raw=k; if(ops[k]) uid=ops[k]; } });
    if(!d||!raw) return;
    if(!uid){ unknown[raw]=(unknown[raw]||0)+1; return; }
    const key=d+"_"+uid; acc[key]=acc[key]||{mgEnv:0,mgPay:0,uid:uid,day:d};
    acc[key][sec]+=1;
  });
  const lignes=Object.keys(acc).sort().map(k=>({key:k, uid:acc[k].uid, label:userById(acc[k].uid).name+" · "+acc[k].day,
    mgEnv:acc[k].mgEnv, mgPay:acc[k].mgPay}));
  if(lignes.length) return {type:"MoneyGram", lignes:lignes, unknown:unknown,
    total:{mgEnv:lignes.reduce((a,b)=>a+b.mgEnv,0), mgPay:lignes.reduce((a,b)=>a+b.mgPay,0)}};
  return {type:null, lignes:[], unknown:unknown};
}

function wireImport(){
  const inp=document.getElementById("imp-file"); if(!inp) return;
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const box=document.getElementById("imp-res");
    box.innerHTML=`<div class="note">${t().impReading}</div>`;
    if(typeof XLSX==="undefined"){ box.innerHTML=`<div class="note" style="color:var(--bad)">⚠ ${t().impLib}</div>`; return; }
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:"array"});
      let best=null;
      wb.SheetNames.forEach(n=>{
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""});
        const r=analyseRows(rows);
        if(r&&r.type&&(!best||r.lignes.length>best.lignes.length)) best=r;
      });
      renderImport(best);
    }catch(e){ box.innerHTML=`<div class="note" style="color:var(--bad)">⚠ ${esc(String(e.message||e))}</div>`; }
  });
}

    if(!n||!/^[0-9]{4}$/.test(p)){ document.getElementById("umsg").textContent="⚠ "+T2.addErr; return; }
    const pal=["#7FD4C1","#F5C400","#C9A7F0","#8FB9F0","#F2A78C","#B9D97A"];
    USERS.push({id:"u"+Date.now().toString(36), name:n, h:await sha(SALT+p), admin:false, color:pal[USERS.length%pal.length]});
    if(DB){try{await DB.doc("config/users").set({list:USERS.map(x=>({id:x.id,name:x.name,h:x.h,opid:x.opid||""}))});}catch(e){}}
    logIt("users",T2.addBtn+" · "+n); renderAll();
  });

  document.getElementById("c-unlock").addEventListener("click",async()=>{
    const mk=YEAR+"-"+pad2(CUR+1);
    const L=tasksFor(CUR);
    for(let i=0;i<L.length;i++){ const id=mk+"-"+i; unlocked[id]=true;
      if(DB){try{await DB.doc("unlocked/"+id).set({by:ME.id,at:new Date().toISOString()});}catch(e){}} }
    logIt("unlock",T2.cUnlock); renderTasks(); msg(T2.cUnlock);
  });

  document.getElementById("c-export").addEventListener("click",()=>{
    const out=document.getElementById("c-out");
    out.style.display="block";
    out.value=JSON.stringify({exporte:new Date().toISOString(),par:ME.name,jours:jours,taches:taches,extras:extras,apprend:apprend,mois:mois,recap:recap,journal:journal},null,1);
    out.select(); msg(T2.cExport);
  });

  const dz=[["c-log","journal","journal",T2.cLog],["c-recap","recap","recap",T2.cRecap],
            ["c-jours","jours","jours",T2.cJours],["c-tasks","taches","taches",T2.cTasks],
            ["c-extras","extras","extras",T2.cExtras]];
  dz.forEach(([id,coll,store,label])=>{
    document.getElementById(id).addEventListener("click",async()=>{
      if(!confirm(T2.confirmAsk.replace("{n}",label))) return;
      await wipe(coll,store);
      if(store==="taches"){ if(DB){ try{const s=await DB.collection("unlocked").get();
        for(const d of s.docs){ try{await DB.collection("unlocked").doc(d.id).delete();}catch(e){} } }catch(e){} } }
      logIt("wipe",label); if(!DB) saveLocal(); renderAll(); msg(label);
    });
  });

  document.getElementById("dz-go").addEventListener("click",async()=>{
    const v=String(document.getElementById("dz-in").value).trim().toUpperCase();
    if(v!==T2.dzWord){ document.getElementById("c-msg").innerHTML='<span style="color:var(--bad);font-weight:600">⚠ '+esc(T2.dzWord)+'</span>'; return; }
    for(const c of ["journal","recap","jours","taches","unlocked","mois","extras"]) await wipe(c,c);
    try{ localStorage.removeItem("cs-bienne-2026"); }catch(e){}
    logIt("wipe",T2.dzBtn); renderAll(); msg(T2.dzDone);
  });
}

const SC={
dormant:{
 wa:{fr:"Bonjour {nom}, ici Capital Services Bienne. On ne vous a plus vu depuis un moment et on voulait prendre de vos nouvelles. Si vous envoyez toujours au {pays}, passez nous voir : on regarde ensemble le taux du jour, sans engagement. Bonne journée !",
  es:"Buenos días {nom}, le escribe Capital Services Bienne. Hace tiempo que no le vemos y queríamos saber cómo está. Si sigue enviando a {pays}, pásese por la agencia: miramos juntos la tasa del día, sin compromiso. ¡Buen día!",
  de:"Guten Tag {nom}, hier Capital Services Biel. Wir haben Sie länger nicht gesehen und wollten uns kurz melden. Falls Sie weiterhin nach {pays} senden: Kommen Sie vorbei, wir schauen den heutigen Kurs zusammen an – unverbindlich. Freundliche Grüsse",
  pt:"Bom dia {nom}, aqui é a Capital Services Bienne. Há algum tempo que não o vemos e queríamos saber como está. Se continua a enviar para {pays}, passe pela agência: vemos juntos a taxa do dia, sem compromisso. Bom dia!",
  en:"Hello {nom}, this is Capital Services Bienne. We haven't seen you in a while and wanted to check in. If you're still sending to {pays}, drop by the branch — we'll look at today's rate together, no obligation. Have a good day!"},
 call:{fr:"1. « Bonjour, Capital Services Bienne, c'est {nom} ? »\n2. « On regardait nos clients du {pays} et on a vu qu'on ne vous avait plus vu depuis un moment — tout va bien ? »\n3. Écouter sans couper.\n4. Noter la vraie raison, pas la première réponse polie.\n5. « Passez quand vous voulez, je vous fais le point sur le taux. »",
  es:"1. «Buenos días, Capital Services Bienne, ¿hablo con {nom}?»\n2. «Estábamos mirando nuestros clientes de {pays} y vimos que hace tiempo que no le vemos, ¿todo bien?»\n3. Escuchar sin cortar.\n4. Anotar el motivo real, no la primera respuesta educada.\n5. «Pásese cuando quiera y le miro la tasa.»",
  de:"1. «Guten Tag, Capital Services Biel, spreche ich mit {nom}?»\n2. «Wir haben unsere Kunden für {pays} durchgesehen und gemerkt, dass Sie länger nicht da waren – alles gut?»\n3. Zuhören, nicht unterbrechen.\n4. Den echten Grund notieren, nicht die erste höfliche Antwort.\n5. «Kommen Sie vorbei, ich zeige Ihnen den Kurs.»",
  pt:"1. «Bom dia, Capital Services Bienne, falo com {nom}?»\n2. «Estávamos a ver os clientes de {pays} e reparámos que já não o vemos há algum tempo — está tudo bem?»\n3. Ouvir sem interromper.\n4. Anotar o motivo real, não a primeira resposta educada.\n5. «Apareça quando quiser, mostro-lhe a taxa.»",
  en:"1. 'Hello, Capital Services Bienne, is this {nom}?'\n2. 'We were going through our {pays} customers and noticed we haven't seen you in a while — is everything alright?'\n3. Listen, don't interrupt.\n4. Write down the real reason, not the first polite answer.\n5. 'Come by any time and I'll show you the rate.'"}},
rate:{
 wa:{fr:"Bonjour {nom}, Capital Services Bienne. Vous nous aviez dit que le taux vers le {pays} n'était pas bon. On a fait remonter le sujet et on suit les taux chaque semaine. Dites-moi le montant que vous envoyez d'habitude et je vous fais le calcul exact avant que vous vous déplaciez.",
  es:"Buenos días {nom}, Capital Services Bienne. Nos dijo que la tasa hacia {pays} no le salía bien. Hemos pasado el tema a la dirección y seguimos las tasas cada semana. Dígame el importe que suele enviar y le hago el cálculo exacto antes de que se desplace.",
  de:"Guten Tag {nom}, Capital Services Biel. Sie hatten gesagt, der Kurs nach {pays} sei nicht gut. Wir haben das weitergeleitet und verfolgen die Kurse wöchentlich. Sagen Sie mir den Betrag, den Sie üblicherweise senden – ich rechne es Ihnen genau aus, bevor Sie herkommen.",
  pt:"Bom dia {nom}, Capital Services Bienne. Disse-nos que a taxa para {pays} não compensava. Levámos o assunto à direção e acompanhamos as taxas todas as semanas. Diga-me o valor que costuma enviar e faço-lhe o cálculo exato antes de se deslocar.",
  en:"Hello {nom}, Capital Services Bienne. You told us the rate to {pays} wasn't good. We've raised it with management and we track the rates weekly. Tell me the amount you usually send and I'll do the exact calculation before you come in."},
 call:{fr:"1. Reconnaître d'abord : « Vous avez raison, sur le {pays} on n'était pas au niveau. »\n2. Ne jamais critiquer le concurrent.\n3. Demander : « Vous envoyez combien d'habitude, et vous obtenez quoi ailleurs ? »\n4. Noter le chiffre — c'est la preuve pour la direction.\n5. « Je vous rappelle dès que le taux bouge. » Et le faire vraiment.",
  es:"1. Reconocer primero: «Tiene razón, en {pays} no estábamos al nivel.»\n2. Nunca criticar al competidor.\n3. Preguntar: «¿Cuánto suele enviar y qué le dan en el otro sitio?»\n4. Anotar la cifra — es la prueba para la dirección.\n5. «Le llamo en cuanto la tasa cambie.» Y hacerlo de verdad.",
  de:"1. Zuerst anerkennen: «Sie haben recht, bei {pays} waren wir nicht auf dem Niveau.»\n2. Nie über die Konkurrenz herziehen.\n3. Fragen: «Wie viel senden Sie üblicherweise, und was bekommen Sie anderswo?»\n4. Die Zahl notieren – das ist der Beleg für die Direktion.\n5. «Ich melde mich, sobald sich der Kurs ändert.» Und es auch wirklich tun.",
  pt:"1. Reconhecer primeiro: «Tem razão, em {pays} não estávamos ao nível.»\n2. Nunca criticar a concorrência.\n3. Perguntar: «Quanto costuma enviar e quanto lhe dão no outro sítio?»\n4. Anotar o número — é a prova para a direção.\n5. «Ligo-lhe assim que a taxa mudar.» E fazê-lo mesmo.",
  en:"1. Acknowledge first: 'You're right, on {pays} we weren't competitive.'\n2. Never run down the competitor.\n3. Ask: 'How much do you usually send, and what do you get elsewhere?'\n4. Write the figure down — that's the evidence for management.\n5. 'I'll call you as soon as the rate moves.' Then actually do it."}},
comp:{
 wa:{fr:"Bonjour {nom}, Capital Services Bienne. Je sais que vous envoyez ailleurs en ce moment, c'est votre droit. Je vous propose juste ceci : avant votre prochain envoi vers le {pays}, envoyez-moi le montant par WhatsApp. Je vous donne notre chiffre en deux minutes, et vous choisissez.",
  es:"Buenos días {nom}, Capital Services Bienne. Sé que ahora envía por otro sitio, está en su derecho. Solo le propongo esto: antes de su próximo envío a {pays}, mándeme el importe por WhatsApp. Le doy nuestra cifra en dos minutos y usted elige.",
  de:"Guten Tag {nom}, Capital Services Biel. Ich weiss, dass Sie momentan anderswo senden – das ist Ihr gutes Recht. Mein Vorschlag: Schicken Sie mir vor Ihrer nächsten Sendung nach {pays} kurz den Betrag per WhatsApp. Ich nenne Ihnen unsere Zahl in zwei Minuten, und Sie entscheiden.",
  pt:"Bom dia {nom}, Capital Services Bienne. Sei que neste momento envia por outro lado, está no seu direito. Proponho-lhe apenas isto: antes do próximo envio para {pays}, mande-me o valor por WhatsApp. Dou-lhe o nosso número em dois minutos e o senhor escolhe.",
  en:"Hello {nom}, Capital Services Bienne. I know you're sending elsewhere at the moment — that's your right. Here's all I'm asking: before your next transfer to {pays}, send me the amount on WhatsApp. I'll give you our figure in two minutes and you decide."},
 call:{fr:"1. Ne pas se défendre.\n2. « Vous êtes chez qui maintenant ? » — noter le nom du concurrent.\n3. « Et vous obtenez combien pour 500 francs ? » — noter le chiffre.\n4. « Merci, c'est utile, je fais remonter. »\n5. Finir par un engagement concret : « Avant votre prochain envoi, un message et je vous donne notre chiffre. »",
  es:"1. No defenderse.\n2. «¿Con quién está ahora?» — anotar el nombre del competidor.\n3. «¿Y cuánto le dan por 500 francos?» — anotar la cifra.\n4. «Gracias, me sirve, lo paso arriba.»\n5. Terminar con un compromiso concreto: «Antes de su próximo envío, un mensaje y le doy nuestra cifra.»",
  de:"1. Sich nicht rechtfertigen.\n2. «Bei wem sind Sie jetzt?» – Namen der Konkurrenz notieren.\n3. «Und was bekommen Sie für 500 Franken?» – Zahl notieren.\n4. «Danke, das hilft uns, ich gebe es weiter.»\n5. Mit einer konkreten Zusage abschliessen: «Vor Ihrer nächsten Sendung eine Nachricht, und ich nenne Ihnen unsere Zahl.»",
  pt:"1. Não se defender.\n2. «Com quem está agora?» — anotar o nome da concorrência.\n3. «E quanto lhe dão por 500 francos?» — anotar o número.\n4. «Obrigado, é útil, vou passar a informação.»\n5. Terminar com um compromisso concreto: «Antes do próximo envio, uma mensagem e dou-lhe o nosso número.»",
  en:"1. Don't get defensive.\n2. 'Who are you with now?' — write the competitor's name down.\n3. 'And what do you get for 500 francs?' — write the figure down.\n4. 'Thanks, that helps, I'll pass it up.'\n5. Close with a concrete commitment: 'Before your next transfer, one message and I'll give you our figure.'"}},
think:{
 wa:{fr:"Bonjour {nom}, on s'est parlé la semaine dernière. Je ne vous relance pas pour rien : le taux vers le {pays} a bougé aujourd'hui. Si vous voulez, je vous fais le calcul sur votre montant habituel — deux minutes, ça ne vous engage à rien.",
  es:"Buenos días {nom}, hablamos la semana pasada. No le escribo por escribir: la tasa hacia {pays} ha cambiado hoy. Si quiere, le hago el cálculo con su importe habitual — dos minutos y no le compromete a nada.",
  de:"Guten Tag {nom}, wir haben letzte Woche gesprochen. Ich melde mich nicht ohne Grund: Der Kurs nach {pays} hat sich heute bewegt. Wenn Sie möchten, rechne ich es Ihnen mit Ihrem üblichen Betrag aus – zwei Minuten, völlig unverbindlich.",
  pt:"Bom dia {nom}, falámos na semana passada. Não lhe escrevo por escrever: a taxa para {pays} mexeu hoje. Se quiser, faço-lhe o cálculo com o seu valor habitual — dois minutos e não o compromete a nada.",
  en:"Hello {nom}, we spoke last week. I'm not chasing you for nothing: the rate to {pays} moved today. If you like, I'll run the numbers on your usual amount — two minutes, no commitment."},
 call:{fr:"Règle : ne jamais rappeler sans raison nouvelle.\n1. Donner la raison en premier : « Je vous appelle parce que le taux a bougé. »\n2. Proposer un créneau précis : « Vous passez plutôt le matin ou après 16 h ? »\n3. Si c'est encore non : demander la permission de rappeler dans un mois, puis clôturer la fiche.",
  es:"Regla: nunca volver a llamar sin un motivo nuevo.\n1. Dar el motivo primero: «Le llamo porque la tasa ha cambiado.»\n2. Proponer un momento concreto: «¿Le viene mejor por la mañana o después de las 16 h?»\n3. Si sigue siendo no: pedir permiso para llamar dentro de un mes y cerrar la ficha.",
  de:"Regel: nie ohne neuen Grund nachfassen.\n1. Den Grund zuerst nennen: «Ich rufe an, weil sich der Kurs bewegt hat.»\n2. Ein konkretes Zeitfenster vorschlagen: «Passt es Ihnen morgens oder nach 16 Uhr?»\n3. Bleibt es nein: um Erlaubnis bitten, in einem Monat wieder anzurufen, und die Karte schliessen.",
  pt:"Regra: nunca voltar a ligar sem um motivo novo.\n1. Dar o motivo primeiro: «Ligo porque a taxa mexeu.»\n2. Propor um horário concreto: «Prefere de manhã ou depois das 16 h?»\n3. Se continuar a ser não: pedir autorização para ligar dentro de um mês e fechar a ficha.",
  en:"Rule: never follow up without a new reason.\n1. Give the reason first: 'I'm calling because the rate has moved.'\n2. Offer a specific slot: 'Does morning suit you better, or after 4 pm?'\n3. If it's still no: ask permission to call again in a month, then close the record."}},
visa:{
 call:{fr:"Au guichet, après la transaction, jamais avant : « Vous recevez votre salaire sur un compte ? Avec la carte Capital Visa vous le recevez ici, vous retirez au bancomat et vous payez partout. Je vous l'ouvre en 10 minutes, il me faut juste votre pièce d'identité. »",
  es:"En el mostrador, después de la transacción, nunca antes: «¿Recibe su salario en una cuenta? Con la tarjeta Capital Visa lo recibe aquí, saca en el cajero y paga en todas partes. Se la abro en 10 minutos, solo necesito su documento de identidad.»",
  de:"Am Schalter, nach der Transaktion, nie davor: «Bekommen Sie Ihren Lohn auf ein Konto? Mit der Capital-Visa-Karte erhalten Sie ihn hier, heben am Bancomat ab und zahlen überall. Ich eröffne sie in 10 Minuten, ich brauche nur Ihren Ausweis.»",
  pt:"Ao balcão, depois da transação, nunca antes: «Recebe o seu salário numa conta? Com o cartão Capital Visa recebe-o aqui, levanta no multibanco e paga em todo o lado. Abro-lho em 10 minutos, só preciso do seu documento de identificação.»",
  en:"At the counter, after the transaction, never before: 'Do you get your salary paid into an account? With the Capital Visa card you receive it here, withdraw at any ATM and pay anywhere. I can open it in 10 minutes, I just need your ID.'"}},
review:{
 call:{fr:"Juste après un client content, en lui tendant le QR : « Ça vous prend 20 secondes et ça nous aide vraiment : un avis Google. Vous voulez que je vous montre ? » Ne jamais le demander à quelqu'un qui a attendu ou qui a eu un problème.",
  es:"Justo después de un cliente contento, dándole el QR: «Son 20 segundos y nos ayuda de verdad: una reseña en Google. ¿Quiere que se lo enseñe?» Nunca pedírselo a alguien que ha esperado o ha tenido un problema.",
  de:"Direkt nach einem zufriedenen Kunden, mit dem QR-Code in der Hand: «Das dauert 20 Sekunden und hilft uns wirklich: eine Google-Bewertung. Soll ich es Ihnen zeigen?» Nie jemanden fragen, der gewartet hat oder ein Problem hatte.",
  pt:"Logo a seguir a um cliente satisfeito, entregando-lhe o QR: «São 20 segundos e ajuda-nos muito: uma avaliação no Google. Quer que lhe mostre?» Nunca pedir a quem esperou ou teve um problema.",
  en:"Right after a happy customer, handing them the QR code: 'It takes 20 seconds and it really helps us: a Google review. Want me to show you?' Never ask someone who waited or had a problem."}},
biz:{
 call:{fr:"Demander le patron ou les RH, jamais rester à l'accueil. 20 secondes :\n« Bonjour, Capital Services, l'agence de transfert d'argent en ville. Beaucoup de vos employés envoient de l'argent au pays. On peut venir une matinée chez vous : ouverture des cartes et envois sur place. Ça ne coûte rien à l'entreprise et ça leur fait gagner une demi-journée. »\nLaisser un flyer, proposer une date, repartir.",
  es:"Pedir por el dueño o RRHH, nunca quedarse en recepción. 20 segundos:\n«Buenos días, Capital Services, la agencia de envío de dinero de la ciudad. Muchos de sus empleados mandan dinero a su país. Podemos ir una mañana a su empresa: apertura de tarjetas y envíos allí mismo. A la empresa no le cuesta nada y a ellos les ahorra media jornada.»\nDejar un flyer, proponer una fecha, marcharse.",
  de:"Nach der Chefin, dem Chef oder HR fragen, nie am Empfang bleiben. 20 Sekunden:\n«Guten Tag, Capital Services, die Geldtransfer-Agentur in der Stadt. Viele Ihrer Mitarbeitenden senden Geld nach Hause. Wir können einen Morgen zu Ihnen kommen: Karteneröffnung und Überweisungen vor Ort. Für die Firma kostenlos, für sie ein halber Tag gespart.»\nFlyer dalassen, Termin vorschlagen, gehen.",
  pt:"Pedir pelo patrão ou pelos RH, nunca ficar na receção. 20 segundos:\n«Bom dia, Capital Services, a agência de transferências da cidade. Muitos dos vossos funcionários enviam dinheiro para o país. Podemos ir uma manhã à empresa: abertura de cartões e envios no local. À empresa não custa nada e a eles poupa-lhes meio dia.»\nDeixar um flyer, propor uma data, sair.",
  en:"Ask for the owner or HR, never stop at reception. 20 seconds:\n'Good morning, Capital Services, the money transfer branch in town. A lot of your staff send money home. We can come to your premises for a morning: card openings and transfers on site. It costs the company nothing and saves them half a day.'\nLeave a flyer, propose a date, leave."},
 mail:{fr:"Objet : ouverture de cartes et transferts sur place pour vos employés\n\nMadame, Monsieur,\n\nCapital Services est l'agence de transfert d'argent de Bienne. Une partie de vos employés envoie régulièrement de l'argent à l'étranger et cherche un compte pour recevoir son salaire.\n\nNous proposons de venir une matinée dans vos locaux : ouverture des cartes Capital Visa et transferts sur place, sans aucun frais pour l'entreprise.\n\nJe reste à votre disposition pour convenir d'une date.\n\nCordialement,\nFranklin Morocho — Responsable d'agence, Capital Services Bienne",
  es:"Asunto: apertura de tarjetas y envíos en sus instalaciones para sus empleados\n\nEstimada señora, estimado señor:\n\nCapital Services es la agencia de envío de dinero de Bienne. Una parte de sus empleados envía dinero al extranjero con regularidad y busca una cuenta donde recibir su salario.\n\nLes proponemos ir una mañana a sus instalaciones: apertura de tarjetas Capital Visa y envíos allí mismo, sin ningún coste para la empresa.\n\nQuedo a su disposición para fijar una fecha.\n\nUn cordial saludo,\nFranklin Morocho — Responsable de agencia, Capital Services Bienne",
  de:"Betreff: Karteneröffnung und Überweisungen vor Ort für Ihre Mitarbeitenden\n\nSehr geehrte Damen und Herren\n\nCapital Services ist die Geldtransfer-Agentur in Biel. Ein Teil Ihrer Mitarbeitenden sendet regelmässig Geld ins Ausland und sucht ein Konto für den Lohn.\n\nWir kommen gerne einen Morgen zu Ihnen: Eröffnung der Capital-Visa-Karten und Überweisungen vor Ort, für die Firma kostenlos.\n\nGerne vereinbare ich mit Ihnen einen Termin.\n\nFreundliche Grüsse\nFranklin Morocho — Agenturleiter, Capital Services Biel",
  pt:"Assunto: abertura de cartões e transferências nas vossas instalações\n\nExmos. Senhores,\n\nA Capital Services é a agência de transferências de dinheiro de Bienne. Uma parte dos vossos funcionários envia dinheiro para o estrangeiro regularmente e procura uma conta para receber o salário.\n\nPropomos ir uma manhã às vossas instalações: abertura dos cartões Capital Visa e transferências no local, sem qualquer custo para a empresa.\n\nFico à disposição para combinar uma data.\n\nCom os melhores cumprimentos,\nFranklin Morocho — Responsável de agência, Capital Services Bienne",
  en:"Subject: on-site card openings and transfers for your staff\n\nDear Sir or Madam,\n\nCapital Services is the money transfer branch in Bienne. A number of your employees send money abroad regularly and are looking for an account to receive their salary.\n\nWe would come to your premises for a morning: Capital Visa card openings and transfers on site, at no cost to the company.\n\nI am available to agree on a date.\n\nKind regards,\nFranklin Morocho — Branch manager, Capital Services Bienne"}},
central:{
 mail:{fr:"Objet : taux — corridor {pays}, demande d'ajustement chiffrée\n\nBonjour,\n\nCorridor {pays}. Relevé de cette semaine : notre taux ___, concurrent ___ (photo datée en pièce jointe).\n\nDepuis janvier nous avons perdu ___ opérations sur ce corridor. Sur les clients rappelés cette semaine, ___ ont cité le taux comme seule raison de leur départ.\n\nDemande précise : un taux à ___ sur ce corridor. Sans cela ces clients ne reviendront pas, et l'objectif mensuel de l'agence ne sera pas tenu.\n\nMerci d'avance de votre retour,\nAgence de Bienne",

let deferredPrompt=null;

function deviceKind(){

  const android=/Android/i.test(ua);

function isInstalled(){

}

function apprendMois(mk){
  const out={n:0,r:{},pays:{}};
  for(const k in apprend){ const a=apprend[k]||{}; if(String(a.mk)!==mk) continue;
    out.n++; out.r[a.r]=(out.r[a.r]||0)+1;
    const p=a.pays||"—"; out.pays[p]=out.pays[p]||{}; out.pays[p][a.r]=(out.pays[p][a.r]||0)+1; }
  return out;
}
function conseil(st){
  const T2=t(); if(!st.n) return T2.lrnNone;
  const tot=st.n, g=k=>st.r[k]||0, pc=k=>Math.round(g(k)*100/tot);
  const li=[];
  const top=Object.keys(st.r).sort((a,b)=>st.r[b]-st.r[a])[0];
  if(top==="rate") li.push(T2.advRate.replace("{p}",pc("rate")).replace("{n}",g("rate")).replace("{t}",tot));
  if(top==="comp") li.push(T2.advComp.replace("{p}",pc("comp")));
  if(pc("noans")>=35) li.push(T2.advNoans.replace("{p}",pc("noans")));
  if(pc("back")>=20) li.push(T2.advBack.replace("{p}",pc("back")).replace("{n}",g("back")));
  if(g("later")>=5) li.push(T2.advLater.replace("{n}",g("later")));
  const bad=Object.keys(st.pays).map(p=>[p,(st.pays[p].rate||0)+(st.pays[p].comp||0)]).sort((a,b)=>b[1]-a[1])[0];
  if(bad&&bad[1]>=3) li.push(T2.advPays.replace("{p}",bad[0]).replace("{n}",bad[1]));
  if(!li.length) li.push(T2.advKeep);
  return li.join(" ");
}
function todayHasCall(){
  const now=new Date(); if(now.getFullYear()!==YEAR||now.getMonth()!==CUR) return false;
  const d=pad2(now.getDate())+"."+pad2(CUR+1);
  return tasksFor(CUR).concat(extraList(YEAR+"-"+pad2(CUR+1)))
    .some(x=>x.d===d && /appel|appeler|relance|llamad|llamar|seguimiento/i.test(String(x.fr||"")+" "+String(x.es||"")));
}

  sub("jours",o=>{jours=o; if(ME){renderToday();renderMonth();renderYear();renderBonus();}});
  sub("taches",o=>{taches=o; if(ME){renderTasks();renderLog();}});
  sub("mois",o=>{mois=o; if(ME){renderYear();renderToday();renderMonth();}});
  sub("journal",o=>{journal=o; if(ME)renderLog();});
  sub("unlocked",o=>{unlocked=o; if(ME)renderTasks();});
  sub("recap",o=>{recap=o; if(ME)renderRecap();});
  sub("extras",o=>{extras=o; if(ME)renderTasks();});
  sub("apprend",o=>{apprend=o; if(ME)renderLearn();});
  setTimeout(()=>{ if(ME) setStatus("live"); },300);
})();
</script>
