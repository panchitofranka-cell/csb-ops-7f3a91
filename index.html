<style>
:root{
  --paper:#F4F4F1; --card:#FFFFFF; --sunk:#EBEBE6; --line:#DCDCD5; --line2:#C9C9C0;
  --ink:#16150F; --ink2:#4A4940; --ink3:#77766B;
  --brand:#F5C400; --brand-ink:#7A6100;
  --ok:#1F7A4D; --ok-bg:#E4F1E9; --warn:#A96A00; --warn-bg:#FBEEDA; --bad:#AA2A20; --bad-bg:#FBE6E4;
  --shadow:0 1px 2px rgba(20,19,15,.05), 0 8px 20px -14px rgba(20,19,15,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121210; --card:#1B1B18; --sunk:#232320; --line:#2E2E29; --line2:#3C3C35;
  --ink:#EFEEE7; --ink2:#B4B3A8; --ink3:#87867B;
  --brand:#F5C400; --brand-ink:#F5C400;
  --ok:#5FC08C; --ok-bg:#16301F; --warn:#E0A03A; --warn-bg:#332506; --bad:#F08C82; --bad-bg:#331714;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#121210; --card:#1B1B18; --sunk:#232320; --line:#2E2E29; --line2:#3C3C35;
  --ink:#EFEEE7; --ink2:#B4B3A8; --ink3:#87867B;
  --brand:#F5C400; --brand-ink:#F5C400;
  --ok:#5FC08C; --ok-bg:#16301F; --warn:#E0A03A; --warn-bg:#332506; --bad:#F08C82; --bad-bg:#331714;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.02em;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 72px}

/* ===================== GATE ===================== */
#gate{position:fixed;inset:0;z-index:99;background:#0A0A09;color:#EDEDE7;
  display:flex;align-items:center;justify-content:center;padding:24px;
  transition:opacity .55s ease, visibility .55s}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.gate-in{width:100%;max-width:420px;text-align:center}
.gate-eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#6F6E64;font-weight:600}
.gate-eyebrow b{background:var(--brand);color:#0A0A09;padding:1px 5px;border-radius:3px;letter-spacing:.1em}
#gate h1{font-size:31px;font-weight:800;margin:14px 0 0;color:#fff;letter-spacing:-.03em}
#gate p{margin:9px 0 0;color:#84837A;font-size:13.5px}

.stage{position:relative;height:230px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.ring{position:absolute;width:186px;height:186px;border:1px solid #2B2B27;border-radius:50%;
  opacity:0;transition:opacity .7s ease .1s}
.stage.intro .ring{opacity:1}
.ring::after{content:"";position:absolute;top:50%;left:50%;width:5px;height:5px;margin:-2.5px;
  background:#4A4A44;border-radius:50%}
.cells{display:flex;gap:14px;position:relative}
.cell{width:62px;height:74px;border-radius:17px;border:1.5px solid #33332E;background:#171715;
  display:flex;align-items:center;justify-content:center;
  font-family:Archivo;font-size:31px;font-weight:700;color:#fff;
  transition:transform .85s cubic-bezier(.22,1,.36,1), border-color .3s, box-shadow .3s, opacity .45s, background .3s}
.cell.on{border-color:#EDEDE7;box-shadow:0 0 0 1px #EDEDE7, 0 0 26px -4px rgba(237,237,231,.55)}
.stage.intro .cell:nth-child(1){transform:translate(2px,-104px)}
.stage.intro .cell:nth-child(2){transform:translate(78px,-24px) }
.stage.intro .cell:nth-child(3){transform:translate(-6px,58px)}
.stage.intro .cell:nth-child(4){transform:translate(-92px,6px)}
.stage.err .cells{animation:shake .42s}
.stage.err .cell{border-color:#C0554C;box-shadow:0 0 0 1px rgba(192,85,76,.5)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.stage.ok .cell{opacity:0;transform:scale(.5)}
.burst{position:absolute;width:150px;height:150px;opacity:0;transition:opacity .3s}
.stage.ok .burst{opacity:1}
.core{position:absolute;top:50%;left:50%;width:96px;height:96px;margin:-48px;border-radius:28px;
  border:2px solid #4FBF8B;transform:scale(.4);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s}
.core::after{content:"";position:absolute;inset:16px;border-radius:16px;background:#1B4634;border:1.5px solid #4FBF8B}
.stage.ok .core{transform:scale(1);opacity:1}
.spark{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;background:#6FD3A2;opacity:0}
.stage.ok .spark{animation:fly .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
 25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9)}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:262px;margin:4px auto 0}
.pad button{height:50px;border:1px solid #2B2B27;background:#151513;color:#EDEDE7;border-radius:12px;
  font:600 19px/1 "IBM Plex Mono";cursor:pointer;transition:background .15s}
.pad button:hover{background:#201F1D}
.pad button:active{background:#2A2926}
.pad button.wide{grid-column:span 1;font-size:14px;font-family:"IBM Plex Sans"}
.gate-msg{min-height:22px;margin-top:16px;font-size:13px;font-weight:600}
.gate-msg.bad{color:#E2887F}.gate-msg.good{color:#6FD3A2}
.gate-foot{margin-top:18px;font-size:11px;color:#5B5A52;line-height:1.5}

/* ===================== APP ===================== */
header{background:var(--ink);color:#F4F4F1;padding:18px 0 0}
.hrow{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-family:Archivo;font-weight:800;font-size:17px;letter-spacing:-.03em;line-height:1}
.mark b{background:var(--brand);color:#16150F;padding:1px 6px;border-radius:3px}
.mark small{display:block;font-size:9px;letter-spacing:.16em;font-weight:600;color:var(--brand);margin-top:5px;text-transform:uppercase;font-family:"IBM Plex Sans"}
.spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:#D9D8CF;font:600 12px/1 "IBM Plex Sans";padding:7px 11px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#16150F}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border-radius:20px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;color:#EDEDE7}
.userchip button{border:0;background:rgba(255,255,255,.12);color:#D9D8CF;border-radius:14px;padding:4px 9px;font:600 11px/1 "IBM Plex Sans";cursor:pointer}
.htitle{max-width:1120px;margin:0 auto;padding:22px 20px 20px}
.htitle h1{font-size:clamp(25px,4vw,37px);font-weight:800;color:#fff;line-height:1.03}
.htitle p{margin:8px 0 0;color:#A3A298;font-size:13.5px;max-width:62ch}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#A3A298;margin-top:12px;
  background:rgba(255,255,255,.07);padding:5px 10px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:#77766B;flex:none}
.dot.on{background:#5FC08C}.dot.off{background:#E0A03A}

section{margin-top:34px}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.shead h2{font-size:19px;font-weight:700}
.shead .hint{font-size:12.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.p18{padding:18px}

.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tcell{background:var(--card);padding:15px 16px 16px}
.tcell .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tcell .v{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:29px;font-weight:600;line-height:1.05;margin-top:7px}
.tcell .s{font-size:11.5px;color:var(--ink2);margin-top:4px}
.tcell.hero{background:var(--ink);color:#F4F4F1}
.tcell.hero .k{color:var(--brand)}.tcell.hero .s{color:#A3A298}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;align-items:end}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:5px}
input[type=number],input[type=date],input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:7px;
  background:var(--sunk);color:var(--ink);font:500 15px/1.2 "IBM Plex Mono";font-variant-numeric:tabular-nums}
input[type=date],select,input[type=text]{font-family:"IBM Plex Sans";font-size:13px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{border:0;border-radius:7px;padding:10px 16px;font:600 13px/1 "IBM Plex Sans";cursor:pointer;background:var(--brand);color:#16150F}
.btn:hover{filter:brightness(.94)}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{padding:6px 11px;font-size:12px}
.saved{font-size:12px;color:var(--ok);font-weight:600}

.prog{display:grid;gap:22px}
.prow{display:grid;grid-template-columns:112px 1fr 138px;gap:14px;align-items:center}
.prow .nm{font-weight:600;font-size:13.5px}
.prow .nm span{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.bar{height:24px;background:var(--sunk);border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px 0 0 4px;display:block}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.bar .tick::after{content:attr(data-l);position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font:600 9px/1 "IBM Plex Sans";color:var(--ink3);white-space:nowrap;letter-spacing:.04em}
.prow .fig{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.prow .fig span{display:block;font-size:11px;color:var(--ink3);font-weight:500;font-family:"IBM Plex Sans"}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font:600 11px/1.55 "IBM Plex Sans";white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-mut{background:var(--sunk);color:var(--ink3)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{background:var(--sunk);font:600 10.5px/1.4 "IBM Plex Sans";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr.now{background:rgba(245,196,0,.13)}
@supports (background:color-mix(in srgb,red 10%,transparent)){
  tbody tr.now{background:color-mix(in srgb,var(--brand) 12%,transparent)}
}
tbody tr.tot td{font-weight:700;background:var(--sunk);border-top:2px solid var(--line2)}
td.num{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
td input{width:76px;padding:5px 7px;font-size:13px;text-align:right}
.minibar{display:inline-block;width:52px;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:7px;border:1px solid var(--line)}
.minibar i{display:block;height:100%}

.wk h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);font-weight:700;
  padding:16px 0 9px;border-bottom:1px solid var(--line);margin-bottom:2px}
.task{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--brand);cursor:pointer;flex:none}
.task input[type=checkbox]:disabled{cursor:not-allowed;opacity:.45}
.task .d{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--ink3);flex:none;width:48px;padding-top:3px}
.task .t{flex:1;font-size:13.5px;min-width:180px}
.task.done .t{color:var(--ink3);text-decoration:line-through}
.task.miss{background:rgba(170,42,32,.06)}
.task .meta{flex:none;display:flex;gap:6px;align-items:center;padding-top:1px}
.task.weekly .t::before{content:"↻ ";color:var(--brand-ink);font-weight:700}
.hbtn{font:600 11px/1.5 "IBM Plex Sans";padding:3px 9px;border-radius:20px;border:1px solid var(--line2);
  background:transparent;color:var(--brand-ink);cursor:pointer;white-space:nowrap}
.hbtn:hover{background:var(--sunk)}
.how{margin:0 4px 12px 59px;padding:12px 14px;background:var(--sunk);border-left:3px solid var(--brand);
  border-radius:0 9px 9px 0;font-size:12.5px;line-height:1.62;color:var(--ink2)}
.newtask{background:var(--sunk);border:1px dashed var(--line2);border-radius:11px;padding:15px;margin-bottom:18px}
.newtask textarea{width:100%;min-height:66px;font-size:13px;line-height:1.5}
.pinv{font-family:"IBM Plex Mono";font-size:13.5px;font-weight:600;letter-spacing:.16em;min-width:56px;
  display:inline-block;text-align:center;color:var(--ink)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font:600 10.5px/1.6 "IBM Plex Sans";
  background:var(--sunk);color:var(--ink3);white-space:nowrap}
@media(max-width:640px){.how{margin-left:4px}}

.who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.av{width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font:700 9.5px/1 "IBM Plex Sans";color:#16150F;flex:none}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.corr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.corr:last-child{border-bottom:0}
.corr .v{font-family:"IBM Plex Mono";font-weight:600;font-size:13px}
.note{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.5}
.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.score{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--card)}
.score .n{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.score .b{font-family:"IBM Plex Mono";font-size:22px;font-weight:600;margin-top:6px}
.score .s{font-size:11.5px;color:var(--ink3)}

/* admin */
.ah{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);font-weight:700;margin-bottom:12px}
.ulist{display:grid;gap:9px}
.urow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.urow input[type=text]{flex:1;min-width:110px}
.ctrl{display:flex;gap:9px;flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line2))}
@supports not (color:color-mix(in srgb,red 10%,white)){.btn.danger{border-color:var(--line2)}}
.danger-zone{margin-top:22px;border:1px solid var(--bad);border-radius:9px;padding:14px;background:var(--bad-bg)}
.dz-t{font:700 13px/1.2 "IBM Plex Sans";color:var(--bad)}
.dz-d{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.btn.danger-btn{background:var(--bad);color:#fff}
/* recap */
.rcbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rcbar select{width:auto;min-width:170px}
textarea{width:100%;min-height:110px;padding:12px 13px;border:1px solid var(--line2);border-radius:9px;
  background:var(--sunk);color:var(--ink);font:400 14.5px/1.55 "IBM Plex Sans";resize:vertical}
textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.mic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--sunk);
  color:var(--ink);border-radius:22px;padding:8px 15px;font:600 13px/1 "IBM Plex Sans";cursor:pointer}
.mic .rec{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.mic.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.mic.on .rec{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.rcpost{border-left:2.5px solid var(--line2);padding:2px 0 2px 14px;margin:16px 0}
.rcpost .hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.rcpost .tx{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.rcday{font:700 11px/1 "IBM Plex Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);
  padding:14px 0 2px;border-top:1px solid var(--line);margin-top:16px}
.log{max-height:420px;overflow-y:auto}
.logrow{display:flex;gap:11px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.logrow:last-child{border-bottom:0}
.logrow .ts{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink3);flex:none;width:96px}
.logrow .tx{flex:1;color:var(--ink2)}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.6}
@media(max-width:640px){
  .prow{grid-template-columns:1fr;gap:6px}.prow .fig{text-align:left}
  .task{flex-wrap:wrap}.task .meta{width:100%;padding-left:59px}
}

/* --- mobile & tactile --- */
html{-webkit-text-size-adjust:100%}
@media(max-width:560px){
  .wrap{padding:0 14px 56px}
  .hrow{padding:0 14px;gap:10px}
  .htitle{padding:18px 14px 16px}
  .htitle h1{font-size:23px}
  section{margin-top:26px}
  .p18{padding:14px}
  .today{grid-template-columns:1fr 1fr}
  .today .tcell:last-child{grid-column:1 / -1}
  .tcell{padding:13px 13px 14px}
  .tcell .v{font-size:24px}
  .shead h2{font-size:17px}

 {w:1,d:"03.09",fr:"Afficher les objectifs quotidiens au guichet, visibles par toute l'équipe",es:"Colocar los objetivos diarios en el guichet, visibles para todo el equipo",hf:"Reprendre les trois chiffres de la section « Objectifs d'aujourd'hui » de cette application et les écrire au feutre sur le tableau, en gros. Les réécrire chaque matin à l'ouverture, avec le chiffre de la veille à côté pour comparer.",hs:"Coger las tres cifras de la sección «Objetivos de hoy» de esta aplicación y escribirlas con rotulador en la pizarra, en grande. Reescribirlas cada mañana al abrir, con la cifra del día anterior al lado para comparar."},
 {w:1,d:"03.09",fr:"Briefing équipe : chaque transaction finit par une carte Visa proposée et un avis Google demandé",es:"Briefing equipo: cada transacción termina con una tarjeta Visa ofrecida y una reseña Google pedida",hf:"10 minutes avant l'ouverture. Deux phrases à dire à chaque client : « Vous voulez une carte Visa pour recevoir votre salaire ? » et « Si vous êtes content, laissez-nous un avis Google, ça prend 20 secondes ». Chacun note le soir combien de cartes il a proposées.",hs:"10 minutos antes de abrir. Dos frases para decir a cada cliente: «¿Quiere una tarjeta Visa para recibir su salario?» y «Si está contento, déjenos una reseña en Google, son 20 segundos». Cada uno anota por la tarde cuántas tarjetas ofreció."},
 {w:1,d:"03.09",fr:"Envoyer à la centrale les 3 questions (comptage MG, objectif Ria juillet, volumes réels 2025)",es:"Enviar a la central las 3 preguntas (conteo MG, objetivo Ria julio, volúmenes reales 2025)",hf:"Un seul e-mail, trois questions numérotées : 1) MoneyGram, envois seuls ou envois + paiements pour l'objectif ? 2) Objectif Ria juillet : 559 (RH) ou 580 (lettre) ? 3) Volumes réels Mercury de janvier à juin. Demander une réponse écrite et garder le fil.",hs:"Un solo correo, tres preguntas numeradas: 1) MoneyGram, ¿solo envíos o envíos + pagos para el objetivo? 2) Objetivo Ria julio: ¿559 (RRHH) o 580 (carta)? 3) Volúmenes reales de Mercury de enero a junio. Pedir respuesta por escrito y guardar el hilo."},
 {w:1,d:"04.09",fr:"Appeler les 8 premiers clients perdus de la liste Excel",es:"Llamar a los 8 primeros clientes perdidos de la lista Excel",hf:"Ouvrir la liste Excel, trier par date du dernier envoi. Appeler en fin de matinée ou après 17 h. Ouverture : « Bonjour, c'est Capital Services Bienne, on ne vous a plus vu depuis mars, tout va bien ? » Écouter la raison et la noter. Si c'est le taux, proposer de rappeler dès qu'il bouge.",hs:"Abrir la lista Excel, ordenar por fecha del último envío. Llamar a media mañana o después de las 17 h. Apertura: «Buenos días, es Capital Services Bienne, no le vemos desde marzo, ¿todo bien?» Escuchar el motivo y anotarlo. Si es la tasa, ofrecer volver a llamar en cuanto cambie."},
 {w:1,d:"04.09",fr:"Sortir la liste des clients Mercury Kenya et Sénégal",es:"Sacar la lista de clientes Mercury Kenia y Senegal",hf:"Sortir de Mercury la liste des clients qui envoyaient vers le Kenya et le Sénégal en 2025 et plus rien en 2026. Coller dans l'Excel : nom, téléphone, dernier envoi, montant habituel. C'est la liste d'appels des deux semaines suivantes.",hs:"Sacar de Mercury la lista de clientes que enviaban a Kenia y Senegal en 2025 y nada en 2026. Pegarla en el Excel: nombre, teléfono, último envío, importe habitual. Esa es la lista de llamadas de las dos semanas siguientes."},
 {w:1,d:"05.09",fr:"Samedi : pression maximale au guichet, carte Visa proposée à tous",es:"Sábado: máxima presión en el guichet, tarjeta Visa ofrecida a todos",hf:"Le samedi fait le tiers de la semaine. Les deux caissiers au guichet, pas de tâche administrative. Carte Visa proposée à tout le monde, sans exception. Avis Google demandé à chaque client qui repart content. Chiffres saisis le soir même.",hs:"El sábado hace un tercio de la semana. Los dos cajeros en el guichet, nada de trabajo administrativo. Tarjeta Visa ofrecida a todo el mundo, sin excepción. Reseña de Google pedida a cada cliente que se va contento. Cifras metidas esa misma tarde."},
 {w:1,d:"05.09",wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)",hf:"Le samedi avant l'ouverture ou après la fermeture. Vitrine extérieure, porte et plaque d'enseigne. Raclette et produit, pas de chiffon sec. Une vitrine sale fait perdre des clients avant même qu'ils entrent.",hs:"El sábado antes de abrir o después de cerrar. Escaparate exterior, puerta y placa del rótulo. Rasqueta y producto, nada de trapo seco. Un escaparate sucio pierde clientes antes de que entren."},
 {w:2,d:"07.09",fr:"Appels Mercury Kenya (−215 opérations)",es:"Llamadas Mercury Kenia (−215 operaciones)",hf:"215 opérations perdues : c'est le plus gros trou de l'année. Prendre la liste sortie le 4 et appeler 15 personnes dans la journée. Question clé : « Vous envoyez toujours au Kenya ? Par qui ? » Noter le concurrent et son taux : c'est la preuve à envoyer à la direction.",hs:"215 operaciones perdidas: es el agujero más grande del año. Coger la lista del día 4 y llamar a 15 personas en el día. Pregunta clave: «¿Sigue enviando a Kenia? ¿Con quién?» Anotar el competidor y su tasa: es la prueba que hay que mandar a dirección."},
 {w:2,d:"08.09",fr:"Appels Mercury Sénégal (−160) + relevé des taux Western Union, Ria, MoneyTrans",es:"Llamadas Mercury Senegal (−160) + toma de tasas Western Union, Ria, MoneyTrans",hf:"Le matin, 15 appels Sénégal. L'après-midi, relever les taux affichés chez Western Union, Ria et MoneyTrans à Bienne pour les cinq corridors qui baissent. Photo de chaque affichage, avec la date. Sans preuve, la demande de meilleur taux ne passera pas.",hs:"Por la mañana, 15 llamadas a Senegal. Por la tarde, anotar las tasas expuestas en Western Union, Ria y MoneyTrans en Bienne para los cinco corredores que caen. Foto de cada cartel, con la fecha. Sin pruebas, la petición de mejor tasa no pasa."},
 {w:2,d:"09.09",fr:"Appels Ria Togo (−67 %) et Guinée (−56 %)",es:"Llamadas Ria Togo (−67 %) y Guinea (−56 %)",hf:"Togo −67 % et Guinée −56 % : ce sont des baisses de taux, pas des clients partis. Appeler et demander franchement : « On a vu que vous n'envoyez plus, c'est le taux ? » Si oui, noter le montant habituel — ça chiffre la perte pour la direction.",hs:"Togo −67 % y Guinea −56 %: son bajadas de tasa, no clientes que se han ido. Llamar y preguntar claro: «Hemos visto que ya no envía, ¿es por la tasa?» Si es que sí, anotar el importe habitual — eso pone cifras a la pérdida para dirección."},
 {w:2,d:"10.09",fr:"Appels Ria Portugal (−58 %) — 3e nationalité du canton, plus gros gisement",es:"Llamadas Ria Portugal (−58 %) — 3ª nacionalidad del cantón, mayor bolsa",hf:"Le portugais est la 3e nationalité du canton : c'est le plus gros gisement de la liste. Appeler, mais aussi passer dans les cafés et restaurants portugais avec des flyers. Demander à parler au patron, pas au serveur.",hs:"El portugués es la 3ª nacionalidad del cantón: es la bolsa más grande de la lista. Llamar, pero también pasar por los cafés y restaurantes portugueses con flyers. Pedir hablar con el dueño, no con el camarero."},
 {w:2,d:"11.09",fr:"Clôturer les 22 fiches clients perdus dans l'Excel",es:"Cerrar las 22 fichas de clientes perdidos en el Excel",hf:"Chaque fiche doit finir avec une des quatre réponses : revient, ne revient pas, à rappeler, injoignable. Une fiche sans réponse ne sert à rien. Les « à rappeler » partent dans l'agenda de la semaine du 21.",hs:"Cada ficha tiene que acabar con una de cuatro respuestas: vuelve, no vuelve, volver a llamar, ilocalizable. Una ficha sin respuesta no sirve de nada. Los «volver a llamar» se pasan a la agenda de la semana del 21."},
 {w:2,d:"12.09",fr:"Envoyer le comparatif des taux à la direction, avec preuves",es:"Enviar el comparativo de tasas a la dirección, con pruebas",hf:"Un tableau simple : corridor, notre taux, taux du concurrent, écart, nombre de clients perdus. Les photos en pièce jointe. Terminer par une demande précise, pas générale : « sur ces cinq corridors, il nous faut X ». Copie à l'administration.",hs:"Una tabla sencilla: corredor, nuestra tasa, tasa del competidor, diferencia, número de clientes perdidos. Las fotos adjuntas. Terminar con una petición concreta, no general: «en estos cinco corredores necesitamos X». Copia a administración."},
 {w:2,d:"12.09",wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)",hf:"Le samedi avant l'ouverture ou après la fermeture. Vitrine extérieure, porte et plaque d'enseigne. Raclette et produit, pas de chiffon sec.",hs:"El sábado antes de abrir o después de cerrar. Escaparate exterior, puerta y placa del rótulo. Rasqueta y producto, nada de trapo seco."},
 {w:3,d:"14.09",fr:"Préparer la liste : 15 commerces communautaires + 12 entreprises cibles",es:"Preparar la lista: 15 comercios comunitarios + 12 empresas objetivo",hf:"Commerces : épiceries africaines et latinos, boutiques de téléphonie, coiffeurs, restaurants. Entreprises : construction, nettoyage, travail temporaire — celles qui emploient des étrangers. Pour chacune : nom, adresse, nom du patron si connu. La liste se prépare la veille.",hs:"Comercios: tiendas africanas y latinas, locutorios, peluquerías, restaurantes. Empresas: construcción, limpieza, trabajo temporal — las que emplean extranjeros. De cada una: nombre, dirección, nombre del dueño si se sabe. La lista se prepara la víspera."},
 {w:3,d:"15.09",fr:"Tournée terrain A : commerces africains et latinos, boutiques téléphonie, salons de coiffure",es:"Ruta terreno A: comercios africanos y latinos, locutorios, peluquerías",hf:"Y aller entre 14 h et 16 h, jamais à l'heure du repas. Demander le patron, se présenter en 20 secondes, laisser un présentoir de flyers sur le comptoir et repartir. Ne pas vendre sur place : le but est que les flyers restent. Noter qui a accepté.",hs:"Ir entre las 14 h y las 16 h, nunca a la hora de comer. Preguntar por el dueño, presentarse en 20 segundos, dejar un expositor de flyers en el mostrador y marcharse. No vender allí: el objetivo es que los flyers se queden. Anotar quién aceptó."},
 {w:3,d:"16.09",fr:"Tournée entreprises A : 6 sociétés (construction, nettoyage, temporaire)",es:"Ruta empresas A: 6 sociedades (construcción, limpieza, temporales)",hf:"Demander le responsable RH ou le patron. Argument : « vos employés étrangers envoient de l'argent et ouvrent des comptes — on peut le faire pour tout le monde, sur place, en une matinée ». Laisser une carte et un flyer, et proposer une date.",hs:"Pedir el responsable de RRHH o el dueño. Argumento: «sus empleados extranjeros envían dinero y abren cuentas — podemos hacerlo para todos, allí mismo, en una mañana». Dejar una tarjeta y un flyer, y proponer una fecha."},
 {w:3,d:"17.09",fr:"Tournée terrain B : restaurants portugais, turcs, kosovars, italiens",es:"Ruta terreno B: restaurantes portugueses, turcos, kosovares, italianos",hf:"Mêmes règles que la tournée A, autres quartiers. Les restaurants sont plus réceptifs entre 15 h et 17 h. Repasser dans deux commerces de la tournée A pour vérifier que les flyers sont toujours en place.",hs:"Mismas reglas que la ruta A, otros barrios. Los restaurantes son más receptivos entre las 15 h y las 17 h. Volver a pasar por dos comercios de la ruta A para comprobar que los flyers siguen puestos."},
 {w:3,d:"18.09",fr:"Tournée entreprises B : 6 sociétés + relance téléphonique de la tournée A",es:"Ruta empresas B: 6 sociedades + seguimiento telefónico de la ruta A",hf:"Le matin, six nouvelles sociétés. L'après-midi, rappeler celles de la tournée A : « je passais pour savoir si vos employés avaient des questions ». Un deuxième contact vaut plus que le premier.",hs:"Por la mañana, seis empresas nuevas. Por la tarde, llamar a las de la ruta A: «llamaba para saber si sus empleados tenían preguntas». Un segundo contacto vale más que el primero."},
 {w:3,d:"19.09",fr:"Bilan de mi-mois : où en sont Mercury, MoneyGram et Ria",es:"Balance de mitad de mes: dónde están Mercury, MoneyGram y Ria",hf:"Ouvrir la section « Comment va le mois » : si un système est sous 45 % à la moitié du mois, il ne se rattrapera pas tout seul. Décider ce jour-là où va l'effort des deux semaines restantes et l'écrire dans le bilan du jour.",hs:"Abrir la sección «Cómo va el mes»: si un sistema está por debajo del 45 % a mitad de mes, no se recupera solo. Decidir ese día dónde va el esfuerzo de las dos semanas que quedan y escribirlo en el balance del día."},
 {w:3,d:"19.09",wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)",hf:"Le samedi avant l'ouverture ou après la fermeture. Vitrine extérieure, porte et plaque d'enseigne.",hs:"El sábado antes de abrir o después de cerrar. Escaparate exterior, puerta y placa del rótulo."},
 {w:4,d:"21.09",fr:"Rendez-vous entreprises : proposer l'ouverture groupée de cartes Visa",es:"Citas con empresas: proponer apertura grupal de tarjetas Visa",hf:"Proposer une matinée dans leurs locaux : on ouvre les cartes sur place, avec les pièces d'identité. Dix cartes en une matinée valent une semaine au guichet. Fixer la date par écrit avant de partir.",hs:"Proponer una mañana en sus locales: abrimos las tarjetas allí mismo, con los documentos de identidad. Diez tarjetas en una mañana valen una semana en el guichet. Fijar la fecha por escrito antes de irse."},
 {w:4,d:"22.09",fr:"Deuxième relance des clients qui ont dit « je vais réfléchir »",es:"Segunda llamada a los clientes que dijeron «me lo pienso»",hf:"« Je vais réfléchir » veut dire non, sauf si on rappelle. Rappeler cinq jours après en donnant une raison nouvelle : une promotion, un taux qui a bougé, une date de passage. Sans raison nouvelle, ne pas rappeler.",hs:"«Me lo pienso» quiere decir no, salvo que se vuelva a llamar. Volver a llamar cinco días después con un motivo nuevo: una promoción, una tasa que ha cambiado, una fecha de visita. Sin motivo nuevo, no llamar."},
 {w:4,d:"23.09",fr:"Journée Capital Visa : objectif 5 cartes dans la journée",es:"Jornada Capital Visa: objetivo 5 tarjetas en el día",hf:"Objectif écrit au tableau le matin : 5 cartes. Un des deux caissiers ne fait que ça pendant les heures creuses. Dossiers préparés à l'avance (formulaire + copie de pièce). Compter à 12 h et à 16 h pour savoir s'il faut forcer.",hs:"Objetivo escrito en la pizarra por la mañana: 5 tarjetas. Uno de los dos cajeros solo hace eso en las horas flojas. Carpetas preparadas por adelantado (formulario + copia del documento). Contar a las 12 h y a las 16 h para saber si hay que apretar."},
 {w:4,d:"24.09",fr:"Contacter 3 associations ou églises communautaires",es:"Contactar 3 asociaciones o iglesias comunitarias",hf:"Les églises africaines et latino-américaines et les associations de compatriotes réunissent cent personnes d'un coup. Demander le responsable, proposer un stand après l'office ou une annonce. C'est gratuit et ça touche plus de monde qu'une journée de tournée.",hs:"Las iglesias africanas y latinoamericanas y las asociaciones de paisanos reúnen a cien personas de golpe. Pedir el responsable, proponer una mesa después del culto o un anuncio. Es gratis y llega a más gente que un día de ruta."},
 {w:4,d:"25.09",fr:"Contrôle des avis Google — si moins de 15, doubler les demandes",es:"Control de reseñas Google — si hay menos de 15, doblar las peticiones",hf:"Compter les avis sur la fiche Google de l'agence et saisir le nombre dans « Avis Google ». Sous 15, chaque client satisfait doit repartir avec la demande faite — le QR code posé au guichet enlève l'excuse du « je le ferai plus tard ».",hs:"Contar las reseñas en la ficha de Google de la agencia y meter el número en «Reseñas Google». Por debajo de 15, cada cliente contento tiene que irse con la petición hecha — el código QR en el mostrador quita la excusa del «ya lo haré luego»."},
 {w:4,d:"26.09",fr:"Samedi : dernier grand jour de volume avant la clôture",es:"Sábado: último gran día de volumen antes del cierre",hf:"Dernier samedi complet avant la clôture. Regarder ce qui manque dans « Comment va le mois » et concentrer toute la journée là-dessus. Les deux caissiers au guichet.",hs:"Último sábado completo antes del cierre. Mirar lo que falta en «Cómo va el mes» y concentrar todo el día en eso. Los dos cajeros en el guichet."},
 {w:4,d:"26.09",wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)",hf:"Le samedi avant l'ouverture ou après la fermeture. Vitrine extérieure, porte et plaque d'enseigne.",hs:"El sábado antes de abrir o después de cerrar. Escaparate exterior, puerta y placa del rótulo."},
 {w:5,d:"28.09",fr:"Sprint final Mercury — dernier effort sur l'objectif mensuel",es:"Sprint final Mercury — último esfuerzo sobre el objetivo mensual",hf:"Mercury est le produit de la maison et c'est lui qui pèse le plus. Reprendre la liste des clients qui envoient d'habitude en fin de mois et les appeler un par un : « votre envoi habituel, vous le faites cette semaine ? »",hs:"Mercury es el producto de la casa y es el que más pesa. Coger la lista de los clientes que suelen enviar a final de mes y llamarlos uno a uno: «su envío de siempre, ¿lo hace esta semana?»"},
 {w:5,d:"29.09",fr:"Derniers appels aux clients dormants, clôture des fiches",es:"Últimas llamadas a clientes dormidos, cierre de fichas",hf:"Dernier passage sur les fiches restées ouvertes. Celles qu'on n'a pas jointes en trois essais passent en « injoignable » et sortent de la liste : elles font perdre du temps le mois prochain.",hs:"Última pasada por las fichas que quedan abiertas. Las que no se han localizado en tres intentos pasan a «ilocalizable» y salen de la lista: hacen perder tiempo el mes que viene."},
 {w:5,d:"30.09",fr:"Clôture du mois : chiffres par système, photos du matériel à la centrale, compte rendu",es:"Cierre de mes: cifras por sistema, fotos del material a la central, informe",hf:"Trois chiffres par système, arrêtés le dernier jour ouvré. Photos du matériel et de l'affichage envoyées à la centrale. Compte rendu court : ce qui a marché, ce qui a bloqué, ce qu'il faut de la centrale pour le mois suivant.",hs:"Tres cifras por sistema, cerradas el último día laborable. Fotos del material y de la cartelería a la central. Informe corto: lo que ha funcionado, lo que se ha atascado, lo que hace falta de la central para el mes siguiente."},
 {w:5,d:"30.09",fr:"Envoyer à l'administration le bilan du mois et les propositions",es:"Enviar a administración el balance del mes y las propuestas",hf:"Le bilan seul ne sert à rien : joindre deux ou trois demandes précises (taux, cartes Ria, cadeaux, matériel). Une demande chiffrée et datée obtient une réponse ; une demande générale, non.",hs:"El balance solo no sirve: adjuntar dos o tres peticiones concretas (tasas, tarjetas Ria, regalos, material). Una petición con cifras y fecha consigue respuesta; una general, no."},
 {w:5,d:"30.09",wk:1,fr:"Nettoyage des vitres extérieures (une fois par semaine)",es:"Limpieza de las ventanas exteriores (una vez por semana)",hf:"Le samedi avant l'ouverture ou après la fermeture. Vitrine extérieure, porte et plaque d'enseigne.",hs:"El sábado antes de abrir o después de cerrar. Escaparate exterior, puerta y placa del rótulo."}

const WEEKS={1:{fr:"Semaine du 3 au 5 septembre — mesurer et réagir",es:"Semana del 3 al 5 de septiembre — medir y reaccionar"},
 2:{fr:"Semaine du 7 au 12 — reconquérir les clients perdus",es:"Semana del 7 al 12 — recuperar clientes perdidos"},

/* ===== Plan mensuel : septembre détaillé, autres mois = plan standard ===== */
const TASKS_SEP = TASKS;
function weekOf(y,m,d){ const first=new Date(y,m,1).getDay(); return Math.floor((d + ((first+6)%7) - 1)/7)+1; }
function weekRange(y,m,w){
  const dim=new Date(y,m+1,0).getDate(); let a=null,b=null;
  for(let d=1;d<=dim;d++){ if(weekOf(y,m,d)===w){ if(a===null)a=d; b=d; } }
  return [a,b];
}
function tasksFor(m){
  if(m===8) return TASKS_SEP;
  const dim=new Date(YEAR,m+1,0).getDate(), out=[];
  const lbl=d=>pad2(d)+"."+pad2(m+1);
  let firstOpen=null,lastOpen=null,mid=null;
  for(let d=1;d<=dim;d++){ const dow=new Date(YEAR,m,d).getDay(); if(dow===0)continue;
    if(firstOpen===null)firstOpen=d; lastOpen=d; if(d<=15)mid=d; }
  for(let d=1;d<=dim;d++){
    const dt=new Date(YEAR,m,d), dow=dt.getDay(); if(dow===0) continue;
    const w=weekOf(YEAR,m,d);
    if(d===firstOpen) out.push({w:w,d:lbl(d),fr:"Afficher les objectifs du mois au guichet",es:"Colocar los objetivos del mes en el guichet",hf:"Reprendre les trois chiffres de la section « Objectifs d'aujourd'hui » et les écrire au feutre sur le tableau, en gros, visibles par toute l'équipe.",hs:"Coger las tres cifras de la sección «Objetivos de hoy» y escribirlas con rotulador en la pizarra, en grande, visibles para todo el equipo."});
    if(dow===1) out.push({w:w,d:lbl(d),fr:"Point hebdomadaire : où en sont Mercury, MoneyGram et Ria",es:"Punto semanal: dónde están Mercury, MoneyGram y Ria",hf:"Cinq minutes le lundi matin. Ouvrir « Comment va le mois » : quel système est en retard, combien il manque par jour, qui fait quoi cette semaine.",hs:"Cinco minutos el lunes por la mañana. Abrir «Cómo va el mes»: qué sistema va con retraso, cuánto falta por día, quién hace qué esta semana."});
    if(d===mid) out.push({w:w,d:lbl(d),fr:"Bilan de mi-mois et rattrapage si nécessaire",es:"Balance de mitad de mes y recuperación si hace falta",hf:"Sous 45 % à la moitié du mois, un système ne se rattrape pas tout seul. Décider ce jour-là où va l'effort des deux semaines restantes et l'écrire dans le bilan du jour.",hs:"Por debajo del 45 % a mitad de mes, un sistema no se recupera solo. Decidir ese día dónde va el esfuerzo de las dos semanas que quedan y escribirlo en el balance del día."});

      :t().gbad+" ("+(MAXTRY-n)+")";

  setTries({});

  const burst=document.getElementById("burst"); burst.innerHTML="";
  for(let i=0;i<16;i++){const s=document.createElement("span");s.className="spark";

    s.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    s.style.setProperty("--dy",(Math.sin(a)*r).toFixed(1)+"px");
    s.style.animationDelay=(Math.random()*.16).toFixed(2)+"s";

async function findPin(h){
  for(let b=0;b<10000;b+=500){
    const jobs=[];
    for(let i=b;i<Math.min(b+500,10000);i++){
      const p=String(i).padStart(4,"0");
      jobs.push(sha(SALT+p).then(x=>x===h?p:null));
    }
    const hit=(await Promise.all(jobs)).find(Boolean);
    if(hit) return hit;
  }
  return null;
}

const MONTHS={jan:1,janv:1,feb:2,fev:2,"f\u00e9v":2,"f\u00e9vr":2,mar:3,mars:3,apr:4,avr:4,may:5,mai:5,
  jun:6,juin:6,jul:7,juil:7,aug:8,"ao\u00fb":8,aout:8,"ao\u00fbt":8,sep:9,sept:9,oct:10,nov:11,dec:12,"d\u00e9c":12};
function parseDate(v){
  if(v==null)return null; const s=String(v).trim();
  let m=s.match(/^(\d{4})-([A-Za-z\u00C0-\u00FF]+)-(\d{1,2})/);
  if(m){ const mm=MONTHS[m[2].toLowerCase().replace(/\.$/,"")]; if(mm) return m[1]+"-"+pad2(mm)+"-"+pad2(+m[3]); }
  m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  if(m) return m[3]+"-"+pad2(+m[2])+"-"+pad2(+m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  return null;
}
function opMap(){ const o={}; USERS.forEach(u=>{ if(u.opid) o[String(u.opid).toLowerCase()]=u.id; }); return o; }

function analyseRows(rows){
  const flat=rows.map(r=>r.map(c=>c==null?"":String(c)));
  const join=flat.map(r=>r.join(" | "));
  const ops=opMap();
  // --- Ria : rapport résumé
  const riaHead=join.findIndex(l=>/rapport de transaction/i.test(l));
  if(riaHead>-1){
    let env=0,pay=0,per=null;
    flat.forEach(r=>{
      const a=(r[0]||"");
      if(/Envoi/i.test(a)&&/Transfert/i.test(a)) env+=parseInt(String(r[1]).replace(/\D/g,""),10)||0;
      if(/Paiement/i.test(a)&&/Transfert/i.test(a)) pay+=parseInt(String(r[1]).replace(/\D/g,""),10)||0;
      const p=(r[0]||"").match(/P.riode\s*:\s*([\d./]+)\s*-\s*([\d./]+)/);
      if(p) per=[parseDate(p[1]),parseDate(p[2])];
    });
    if(env||pay){
      const d=(per&&per[1])||todayISO();
      return {type:"Ria", periode:per, lignes:[{key:d, uid:"", label:t().unassigned, ria:env, note:"Ria "+(per?per[0]+" → "+per[1]:"")}], total:{ria:env, riaPay:pay}};
    }
  }
  // --- MoneyGram : rapport détaillé
  let sec=null; const acc={}; const unknown={};
  flat.forEach(r=>{
    const l=r.join(" ").toUpperCase();
    if(/D.TAILS DES ENVOIS/.test(l)) sec="mgEnv";
    else if(/D.TAILS DES R.CEPTIONS/.test(l)) sec="mgPay";
    else if(/D.TAILS DU REMBOURSEMENT/.test(l)) sec="skip";
    else if(/R.CAPITULATIF|R.SUM. DE LA P.RIODE|TOTAL G.N.RAL/.test(l)) sec=null;
    if(!sec||sec==="skip") return;
    let d=null,uid=null,raw=null;
    r.forEach(c=>{ const p=parseDate(c); if(p&&/\d{1,2}:\d{2}/.test(String(c))) d=p;
      const k=String(c).trim().toLowerCase();
      if(/^[a-z]{4,6}\d{3,4}$/.test(k)){ raw=k; if(ops[k]) uid=ops[k]; } });
    if(!d||!raw) return;
    if(!uid){ unknown[raw]=(unknown[raw]||0)+1; return; }
    const key=d+"_"+uid; acc[key]=acc[key]||{mgEnv:0,mgPay:0,uid:uid,day:d};
    acc[key][sec]+=1;
  });
  const lignes=Object.keys(acc).sort().map(k=>({key:k, uid:acc[k].uid, label:userById(acc[k].uid).name+" · "+acc[k].day,
    mgEnv:acc[k].mgEnv, mgPay:acc[k].mgPay}));
  if(lignes.length) return {type:"MoneyGram", lignes:lignes, unknown:unknown,
    total:{mgEnv:lignes.reduce((a,b)=>a+b.mgEnv,0), mgPay:lignes.reduce((a,b)=>a+b.mgPay,0)}};
  return {type:null, lignes:[], unknown:unknown};
}

function renderImport(res){
  const box=document.getElementById("imp-res"), T2=t();
  if(!res||!res.type){ box.innerHTML=`<div class="note" style="color:var(--bad)">⚠ ${T2.impNo}</div>`; window.__IMP=null; return; }
  const uk=Object.keys(res.unknown||{});
  let h=`<div class="note" style="margin-top:12px"><b>${esc(res.type)}</b> — ${res.lignes.length} ${T2.impLines}</div>
   <div class="tblwrap" style="margin-top:8px"><table style="min-width:420px"><thead><tr>
   <th>${T2.who2} / ${T2.date}</th><th>MG ${T2.sends}</th><th>MG ${T2.pays}</th><th>Ria</th></tr></thead><tbody>`;
  res.lignes.forEach(l=>{ h+=`<tr><td>${esc(l.label)}</td><td class="num">${l.mgEnv==null?"—":nf(l.mgEnv)}</td>
    <td class="num">${l.mgPay==null?"—":nf(l.mgPay)}</td><td class="num">${l.ria==null?"—":nf(l.ria)}</td></tr>`; });
  h+=`</tbody></table></div>`;
  if(uk.length) h+=`<div class="note" style="color:var(--warn)">⚠ ${T2.impUnknown}: ${uk.map(esc).join(", ")}</div>`;
  h+=`<div class="note" id="imp-state">${T2.impAuto}</div>`;
  box.innerHTML=h; window.__IMP=res;
  (async()=>{
    let n=0;
    for(const l of res.lignes){
      const cur=jours[l.key]||{mercury:0,mgEnv:0,mgPay:0,ria:0,visa:0,avis:0};
      const rec=Object.assign({},cur);
      if(l.mgEnv!=null) rec.mgEnv=l.mgEnv;
      if(l.mgPay!=null) rec.mgPay=l.mgPay;
      if(l.ria!=null) rec.ria=l.ria;
      rec.by=l.uid||""; rec.name=l.uid?userById(l.uid).name:"Agence";
      rec.at=new Date().toISOString(); rec.src=res.type;
      jours[l.key]=rec; n++;
      if(DB){ try{ await DB.doc("jours/"+l.key).set(rec); }catch(e){} }
    }
    if(!DB && typeof saveLocal==="function") saveLocal();
    logIt("import",res.type+" · "+n+" "+t().impLines); if(!DB && typeof saveLocal==="function") saveLocal();
    const mm=(res.lignes[0]&&res.lignes[0].key||"").slice(5,7);
    if(mm && (+mm-1)!==CUR && +mm>=1 && +mm<=12){ CUR=+mm-1; try{localStorage.setItem("cs-mois",String(CUR));}catch(e){} }
    renderAll(); renderEntry();
    const st=document.getElementById("imp-state");
    if(st) st.innerHTML=`<span class="saved">${t().impDone.replace("{n}",n)} ✓</span>`;
  })();
}

function wireImport(){
  const inp=document.getElementById("imp-file"); if(!inp) return;
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const box=document.getElementById("imp-res");
    box.innerHTML=`<div class="note">${t().impReading}</div>`;
    if(typeof XLSX==="undefined"){ box.innerHTML=`<div class="note" style="color:var(--bad)">⚠ ${t().impLib}</div>`; return; }
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:"array"});
      let best=null;
      wb.SheetNames.forEach(n=>{
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""});
        const r=analyseRows(rows);
        if(r&&r.type&&(!best||r.lignes.length>best.lignes.length)) best=r;
      });
      renderImport(best);
    }catch(e){ box.innerHTML=`<div class="note" style="color:var(--bad)">⚠ ${esc(String(e.message||e))}</div>`; }
  });
}

    <div class="ctrl">

      <button class="btn ghost" id="c-export">${T2.cExport}</button>
      <button class="btn ghost danger" id="c-log">${T2.cLog}</button>
      <button class="btn ghost danger" id="c-recap">${T2.cRecap}</button>
      <button class="btn ghost danger" id="c-jours">${T2.cJours}</button>
      <button class="btn ghost danger" id="c-tasks">${T2.cTasks}</button>
      <button class="btn ghost danger" id="c-extras">${T2.cExtras}</button>

  const msg=(txt)=>{const m=document.getElementById("c-msg");m.innerHTML='<span class="saved">'+esc(txt)+' ✓</span>';setTimeout(()=>{if(m)m.textContent="";},3200);};
  const wipe=async(coll,store)=>{
    if(DB){ try{ const s=await DB.collection(coll).get();
      for(const d of s.docs){ try{ await DB.collection(coll).doc(d.id).delete(); }catch(e){} } }catch(e){} }
    if(store==="journal") journal={}; else if(store==="recap") recap={};
    else if(store==="jours") jours={}; else if(store==="taches"){taches={};unlocked={};}
    else if(store==="extras") extras={};
    else if(store==="mois") mois={};
    if(!DB && typeof saveLocal==="function") saveLocal();

  el.querySelectorAll("button[data-eye]").forEach(b=>b.addEventListener("click",async()=>{
    const i=+b.dataset.eye, u=USERS[i], pv=document.getElementById("pv"+i);
