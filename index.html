<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<title>Pilotage Bienne 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F4F4F1; --card:#FFFFFF; --sunk:#EBEBE6; --line:#DCDCD5; --line2:#C9C9C0;
  --ink:#16150F; --ink2:#4A4940; --ink3:#77766B;
  --brand:#F5C400; --brand-ink:#7A6100;
  --ok:#1F7A4D; --ok-bg:#E4F1E9; --warn:#A96A00; --warn-bg:#FBEEDA; --bad:#AA2A20; --bad-bg:#FBE6E4;
  --shadow:0 1px 2px rgba(20,19,15,.05), 0 8px 20px -14px rgba(20,19,15,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121210; --card:#1B1B18; --sunk:#232320; --line:#2E2E29; --line2:#3C3C35;
  --ink:#EFEEE7; --ink2:#B4B3A8; --ink3:#87867B;
  --brand:#F5C400; --brand-ink:#F5C400;
  --ok:#5FC08C; --ok-bg:#16301F; --warn:#E0A03A; --warn-bg:#332506; --bad:#F08C82; --bad-bg:#331714;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#121210; --card:#1B1B18; --sunk:#232320; --line:#2E2E29; --line2:#3C3C35;
  --ink:#EFEEE7; --ink2:#B4B3A8; --ink3:#87867B;
  --brand:#F5C400; --brand-ink:#F5C400;
  --ok:#5FC08C; --ok-bg:#16301F; --warn:#E0A03A; --warn-bg:#332506; --bad:#F08C82; --bad-bg:#331714;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.02em;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 72px}

/* ===================== GATE ===================== */
#gate{position:fixed;inset:0;z-index:99;background:#0A0A09;color:#EDEDE7;
  display:flex;align-items:center;justify-content:center;padding:24px;
  transition:opacity .55s ease, visibility .55s}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.gate-in{width:100%;max-width:420px;text-align:center}
.gate-eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#6F6E64;font-weight:600}
.gate-eyebrow b{background:var(--brand);color:#0A0A09;padding:1px 5px;border-radius:3px;letter-spacing:.1em}
#gate h1{font-size:31px;font-weight:800;margin:14px 0 0;color:#fff;letter-spacing:-.03em}
#gate p{margin:9px 0 0;color:#84837A;font-size:13.5px}

.stage{position:relative;height:230px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.ring{position:absolute;width:186px;height:186px;border:1px solid #2B2B27;border-radius:50%;
  opacity:0;transition:opacity .7s ease .1s}
.stage.intro .ring{opacity:1}
.ring::after{content:"";position:absolute;top:50%;left:50%;width:5px;height:5px;margin:-2.5px;
  background:#4A4A44;border-radius:50%}
.cells{display:flex;gap:14px;position:relative}
.cell{width:62px;height:74px;border-radius:17px;border:1.5px solid #33332E;background:#171715;
  display:flex;align-items:center;justify-content:center;
  font-family:Archivo;font-size:31px;font-weight:700;color:#fff;
  transition:transform .85s cubic-bezier(.22,1,.36,1), border-color .3s, box-shadow .3s, opacity .45s, background .3s}
.cell.on{border-color:#EDEDE7;box-shadow:0 0 0 1px #EDEDE7, 0 0 26px -4px rgba(237,237,231,.55)}
.stage.intro .cell:nth-child(1){transform:translate(2px,-104px)}
.stage.intro .cell:nth-child(2){transform:translate(78px,-24px) }
.stage.intro .cell:nth-child(3){transform:translate(-6px,58px)}
.stage.intro .cell:nth-child(4){transform:translate(-92px,6px)}
.stage.err .cells{animation:shake .42s}
.stage.err .cell{border-color:#C0554C;box-shadow:0 0 0 1px rgba(192,85,76,.5)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.stage.ok .cell{opacity:0;transform:scale(.5)}
.burst{position:absolute;width:150px;height:150px;opacity:0;transition:opacity .3s}
.stage.ok .burst{opacity:1}
.core{position:absolute;top:50%;left:50%;width:96px;height:96px;margin:-48px;border-radius:28px;
  border:2px solid #4FBF8B;transform:scale(.4);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s}
.core::after{content:"";position:absolute;inset:16px;border-radius:16px;background:#1B4634;border:1.5px solid #4FBF8B}
.stage.ok .core{transform:scale(1);opacity:1}
.spark{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;background:#6FD3A2;opacity:0}
.stage.ok .spark{animation:fly .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
 25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9)}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:262px;margin:4px auto 0}
.pad button{height:50px;border:1px solid #2B2B27;background:#151513;color:#EDEDE7;border-radius:12px;
  font:600 19px/1 "IBM Plex Mono";cursor:pointer;transition:background .15s}
.pad button:hover{background:#201F1D}
.pad button:active{background:#2A2926}
.pad button.wide{grid-column:span 1;font-size:14px;font-family:"IBM Plex Sans"}
.gate-msg{min-height:22px;margin-top:16px;font-size:13px;font-weight:600}
.gate-msg.bad{color:#E2887F}.gate-msg.good{color:#6FD3A2}
.gate-foot{margin-top:18px;font-size:11px;color:#5B5A52;line-height:1.5}

/* ===================== APP ===================== */
header{background:var(--ink);color:#F4F4F1;padding:18px 0 0}
.hrow{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-family:Archivo;font-weight:800;font-size:17px;letter-spacing:-.03em;line-height:1}
.mark b{background:var(--brand);color:#16150F;padding:1px 6px;border-radius:3px}
.mark small{display:block;font-size:9px;letter-spacing:.16em;font-weight:600;color:var(--brand);margin-top:5px;text-transform:uppercase;font-family:"IBM Plex Sans"}
.spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:#D9D8CF;font:600 12px/1 "IBM Plex Sans";padding:7px 11px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#16150F}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border-radius:20px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;color:#EDEDE7}
.userchip button{border:0;background:rgba(255,255,255,.12);color:#D9D8CF;border-radius:14px;padding:4px 9px;font:600 11px/1 "IBM Plex Sans";cursor:pointer}
.htitle{max-width:1120px;margin:0 auto;padding:22px 20px 20px}
.htitle h1{font-size:clamp(25px,4vw,37px);font-weight:800;color:#fff;line-height:1.03}
.htitle p{margin:8px 0 0;color:#A3A298;font-size:13.5px;max-width:62ch}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#A3A298;margin-top:12px;
  background:rgba(255,255,255,.07);padding:5px 10px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:#77766B;flex:none}
.dot.on{background:#5FC08C}.dot.off{background:#E0A03A}

section{margin-top:34px}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.shead h2{font-size:19px;font-weight:700}
.shead .hint{font-size:12.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.p18{padding:18px}

.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tcell{background:var(--card);padding:15px 16px 16px}
.tcell .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tcell .v{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:29px;font-weight:600;line-height:1.05;margin-top:7px}
.tcell .s{font-size:11.5px;color:var(--ink2);margin-top:4px}
.tcell.hero{background:var(--ink);color:#F4F4F1}
.tcell.hero .k{color:var(--brand)}.tcell.hero .s{color:#A3A298}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;align-items:end}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:5px}
input[type=number],input[type=date],input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:7px;
  background:var(--sunk);color:var(--ink);font:500 15px/1.2 "IBM Plex Mono";font-variant-numeric:tabular-nums}
input[type=date],select,input[type=text]{font-family:"IBM Plex Sans";font-size:13px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{border:0;border-radius:7px;padding:10px 16px;font:600 13px/1 "IBM Plex Sans";cursor:pointer;background:var(--brand);color:#16150F}
.btn:hover{filter:brightness(.94)}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{padding:6px 11px;font-size:12px}
.saved{font-size:12px;color:var(--ok);font-weight:600}

.prog{display:grid;gap:22px}
.prow{display:grid;grid-template-columns:112px 1fr 138px;gap:14px;align-items:center}
.prow .nm{font-weight:600;font-size:13.5px}
.prow .nm span{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.bar{height:24px;background:var(--sunk);border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px 0 0 4px;display:block}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.bar .tick::after{content:attr(data-l);position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font:600 9px/1 "IBM Plex Sans";color:var(--ink3);white-space:nowrap;letter-spacing:.04em}
.prow .fig{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.prow .fig span{display:block;font-size:11px;color:var(--ink3);font-weight:500;font-family:"IBM Plex Sans"}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font:600 11px/1.55 "IBM Plex Sans";white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-mut{background:var(--sunk);color:var(--ink3)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{background:var(--sunk);font:600 10.5px/1.4 "IBM Plex Sans";letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr.now{background:rgba(245,196,0,.13)}
@supports (background:color-mix(in srgb,red 10%,transparent)){
  tbody tr.now{background:color-mix(in srgb,var(--brand) 12%,transparent)}
}
tbody tr.tot td{font-weight:700;background:var(--sunk);border-top:2px solid var(--line2)}
td.num{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
td input{width:76px;padding:5px 7px;font-size:13px;text-align:right}
.minibar{display:inline-block;width:52px;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:7px;border:1px solid var(--line)}
.minibar i{display:block;height:100%}

.wk h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);font-weight:700;
  padding:16px 0 9px;border-bottom:1px solid var(--line);margin-bottom:2px}
.task{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--brand);cursor:pointer;flex:none}
.task input[type=checkbox]:disabled{cursor:not-allowed;opacity:.45}
.task .d{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--ink3);flex:none;width:48px;padding-top:3px}
.task .t{flex:1;font-size:13.5px;min-width:180px}
.task.done .t{color:var(--ink3);text-decoration:line-through}
.task.miss{background:rgba(170,42,32,.06)}
.task .meta{flex:none;display:flex;gap:6px;align-items:center;padding-top:1px}
.task.weekly .t::before{content:"↻ ";color:var(--brand-ink);font-weight:700}

.who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.av{width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font:700 9.5px/1 "IBM Plex Sans";color:#16150F;flex:none}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.corr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.corr:last-child{border-bottom:0}
.corr .v{font-family:"IBM Plex Mono";font-weight:600;font-size:13px}
.note{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.5}
.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.score{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--card)}
.score .n{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.score .b{font-family:"IBM Plex Mono";font-size:22px;font-weight:600;margin-top:6px}
.score .s{font-size:11.5px;color:var(--ink3)}
/* recap */
.rcbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rcbar select{width:auto;min-width:170px}
textarea{width:100%;min-height:110px;padding:12px 13px;border:1px solid var(--line2);border-radius:9px;
  background:var(--sunk);color:var(--ink);font:400 14.5px/1.55 "IBM Plex Sans";resize:vertical}
textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.mic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--sunk);
  color:var(--ink);border-radius:22px;padding:8px 15px;font:600 13px/1 "IBM Plex Sans";cursor:pointer}
.mic .rec{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.mic.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.mic.on .rec{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.rcpost{border-left:2.5px solid var(--line2);padding:2px 0 2px 14px;margin:16px 0}
.rcpost .hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.rcpost .tx{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.rcday{font:700 11px/1 "IBM Plex Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);
  padding:14px 0 2px;border-top:1px solid var(--line);margin-top:16px}
.log{max-height:420px;overflow-y:auto}
.logrow{display:flex;gap:11px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.logrow:last-child{border-bottom:0}
.logrow .ts{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink3);flex:none;width:96px}
.logrow .tx{flex:1;color:var(--ink2)}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.6}
@media(max-width:640px){
  .prow{grid-template-columns:1fr;gap:6px}.prow .fig{text-align:left}
  .task{flex-wrap:wrap}.task .meta{width:100%;padding-left:59px}
}

/* --- mobile & tactile --- */
html{-webkit-text-size-adjust:100%}
@media(max-width:560px){
  .wrap{padding:0 14px 56px}
  .hrow{padding:0 14px;gap:10px}
  .htitle{padding:18px 14px 16px}
  .htitle h1{font-size:23px}
  section{margin-top:26px}
  .p18{padding:14px}
  .today{grid-template-columns:1fr 1fr}
  .today .tcell:last-child{grid-column:1 / -1}
  .tcell{padding:13px 13px 14px}
  .tcell .v{font-size:24px}
  .shead h2{font-size:17px}
  .cells{gap:9px}
  .cell{width:54px;height:66px;border-radius:15px;font-size:26px}
  .stage{height:200px}
  #gate h1{font-size:26px}
  input[type=number],input[type=date],input[type=text],select,textarea{font-size:16px}
  .rcbar select{min-width:0;width:100%}
  .rcbar{gap:8px}
  .logrow{flex-wrap:wrap;gap:6px}
  .logrow .ts{width:auto}
  .mark{font-size:15px}
  .userchip{padding:4px 5px 4px 10px;font-size:12px}
}
@media(pointer:coarse){
  .task input[type=checkbox]{width:23px;height:23px}
  .btn{padding:12px 18px}
  .pad button{height:56px}
  .mic{padding:11px 17px}
  a,button,input,select,textarea{-webkit-tap-highlight-color:rgba(245,196,0,.25)}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<!-- ============ GATE ============ -->
<div id="gate">
  <div class="gate-in">
    <div class="gate-eyebrow">Capital <b>Services</b> · Bienne</div>
    <h1 id="g-h1">Code d'accès</h1>
    <p id="g-p">Entrez votre code personnel à 4 chiffres.</p>
    <div class="stage intro" id="stage">
      <div class="ring"></div>
      <div class="core"></div>
      <div class="burst" id="burst"></div>
      <div class="cells" id="cells">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
    </div>
    <div class="pad" id="pad"></div>
    <div class="gate-msg" id="g-msg"></div>
    <div class="gate-foot" id="g-foot"></div>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="hrow">
    <div class="mark">Capital <b>Services</b><small>Agence de Biel/Bienne</small></div>
    <div class="spacer"></div>
    <div class="userchip" id="uchip"></div>
    <div class="seg" role="group" id="langsel">
      <button data-l="fr" aria-pressed="true">Français</button>
      <button data-l="es" aria-pressed="false">Español</button>
    </div>
  </div>
  <div class="htitle">
    <h1 id="h1"></h1><p id="hsub"></p>
    <div class="status"><span class="dot" id="dot"></span><span id="statxt"></span></div>
  </div>
</header>

function sha256js(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow, mw=mp(2,32), L='length', i, j, result='';
  var words=[], bits=ascii[L]*8;
  var hash=sha256js.h=sha256js.h||[], k=sha256js.k=sha256js.k||[], pc=k[L];
  var comp={};
  for(var c=2; pc<64; c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c;
      hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80';
  while(ascii[L]%64-56) ascii+='\x00';
  for(i=0;i<ascii[L];i++){ j=ascii.charCodeAt(i); if(j>>8) return ''; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words[L]]=((bits/mw)|0); words[words[L]]=(bits);
  for(j=0;j<words[L];){
    var w=words.slice(j,j+=16), oh=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]
          +(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
  return result;
}

}

/* ===== JOURNAL ===== */
async function logIt(action,detail){
  if(!ME)return;
  const day=todayISO(), key=day+"_"+ME.id;
  const cur=(journal[key]&&Array.isArray(journal[key].entries))?journal[key].entries.slice():[];
  cur.push({ts:new Date().toISOString(),a:action,d:detail||""});
  const rec={user:ME.id,name:ME.name,day:day,entries:cur.slice(-400)};
  journal[key]=rec;
  if(DB){try{await DB.doc("journal/"+key).set(rec);}catch(e){}} else saveLocal();
  renderLog();
}
function allEntries(){
  const out=[];
  for(const k in journal){const j=journal[k]; if(!j||!Array.isArray(j.entries))continue;
    j.entries.forEach(e=>out.push({u:j.user,n:j.name,ts:e.ts,a:e.a,d:e.d}));}
  out.sort((a,b)=>b.ts.localeCompare(a.ts)); return out;
}

/* ===== GATE ===== */
let buf="";
function paintCells(){
  const cs=document.querySelectorAll("#cells .cell");
  cs.forEach((c,i)=>{c.textContent=buf[i]||"";c.classList.toggle("on",i===buf.length||(buf.length===4&&i===3));});
}
function gateText(){
  document.getElementById("g-h1").textContent=t().gh1;
  document.getElementById("g-p").textContent=t().gp;
  document.getElementById("g-foot").textContent=t().gfoot;
}
function buildPad(){
  const p=document.getElementById("pad");
  p.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")+
    `<button class="wide" data-k="C">C</button><button data-k="0">0</button><button class="wide" data-k="B">⌫</button>`;
  p.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;press(b.dataset.k);});
}
function press(k){
  const st=document.getElementById("stage"); st.classList.remove("err");
  if(k==="C"){buf="";paintCells();return;}
  if(k==="B"){buf=buf.slice(0,-1);paintCells();return;}
  if(!/^[0-9]$/.test(k)||buf.length>=4)return;
  buf+=k; paintCells();
  if(buf.length===4) setTimeout(tryPin,180);
}
function tries(){ try{return JSON.parse(localStorage.getItem("cs-try")||"{}");}catch(e){return {};} }
function setTries(o){ try{localStorage.setItem("cs-try",JSON.stringify(o));}catch(e){} }
async function tryPin(){
  const st=document.getElementById("stage"), msg=document.getElementById("g-msg");
  const tr=tries();
  if(tr.until&&Date.now()<tr.until){
    const s=Math.ceil((tr.until-Date.now())/1000);
    msg.className="gate-msg bad"; msg.textContent=t().glock.replace("{s}",s);
    buf=""; paintCells(); return;
  }
  const hv=await sha(SALT+buf);
  const u=USERS.find(x=>x.h===hv);
  if(!u){
    const n=(tr.n||0)+1, o={n:n};
    if(n>=MAXTRY){o.until=Date.now()+LOCKMS;o.n=0;}
    setTries(o);
    st.classList.add("err"); msg.className="gate-msg bad";
    msg.textContent=n>=MAXTRY?t().glock.replace("{s}",Math.round(LOCKMS/1000))
      :t().gbad+" ("+(MAXTRY-n)+")";
    buf=""; setTimeout(()=>{paintCells();st.classList.remove("err");},450); return; }
  setTries({});
  ME=u; msg.className="gate-msg good"; msg.textContent=t().gwelcome+", "+u.name;
  const burst=document.getElementById("burst"); burst.innerHTML="";
  for(let i=0;i<16;i++){const s=document.createElement("span");s.className="spark";
    const a=Math.random()*Math.PI*2, r=46+Math.random()*54;
    s.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    s.style.setProperty("--dy",(Math.sin(a)*r).toFixed(1)+"px");
    s.style.animationDelay=(Math.random()*.16).toFixed(2)+"s";
    s.style.width=s.style.height=(4+Math.random()*4).toFixed(1)+"px";
    if(i%4===0)s.style.background="#E9F7F0";
    burst.appendChild(s);}
  st.classList.add("ok");
  setTimeout(()=>{
    document.getElementById("gate").classList.add("gone");
    document.getElementById("app").hidden=false;
    try{sessionStorage.setItem("cs-me",u.id);}catch(e){}
    if(!DB) loadLocal();
    renderAll(); renderEntry(); logIt("login","");
  },1150);
}
document.addEventListener("keydown",e=>{
  if(document.getElementById("gate").classList.contains("gone"))return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==="Backspace"){e.preventDefault();press("B");}
  else if(e.key==="Escape")press("C");
});

function renderToday(){
  const c=curTotals(), now=new Date();
  const dd=(now.getFullYear()===YEAR&&now.getMonth()===CUR)?now.getDate():3;
  const left=Math.max(1,openDaysFrom(YEAR,CUR,dd));
  const need=(o,d)=>Math.max(0,Math.ceil((o-d)/left));
  const rows=[["hero",t().mercury,need(OBJ.mercury[CUR],c.mercury),OBJ.mercury[CUR]],
    ["",t().mgEnv,need(OBJ.mg[CUR],c.mgEnv),OBJ.mg[CUR]],["",t().ria,need(OBJ.ria[CUR],c.ria),OBJ.ria[CUR]],
    ["",t().visa,DAILY_VISA,null],["",t().avis,DAILY_AVIS,null]];
  document.getElementById("s-today").innerHTML=
   `<div class="shead"><h2>${t().today}</h2><span class="hint">${t().todayHint} · <strong>${left}</strong> ${t().daysLeft}</span></div>
    <div class="today">`+rows.map(r=>`<div class="tcell ${r[0]}"><div class="k">${esc(r[1])}</div>
     <div class="v">${nf(r[2])}</div><div class="s">${t().perDay}${r[3]?" · "+t().objective+" "+nf(r[3]):""}</div></div>`).join("")+`</div>`;
}
function renderMonth(){
  const c=curTotals(), now=new Date();
  const dd=(now.getFullYear()===YEAR&&now.getMonth()===CUR)?now.getDate():3;
  const left=Math.max(1,openDaysFrom(YEAR,CUR,dd)), total=openDays(YEAR,CUR), elapsed=Math.max(1,total-left);
  const items=[[t().mercury,c.mercury,OBJ.mercury[CUR]],[t().mgEnv,c.mgEnv,OBJ.mg[CUR]],[t().ria,c.ria,OBJ.ria[CUR]]];
  document.getElementById("s-month").innerHTML=
   `<div class="shead"><h2>${t().month}</h2><span class="hint">${t().monthHint}</span></div>
    <div class="card p18"><div class="prog">`+items.map(([nm,done,obj])=>{
      const pct=obj?done/obj*100:0,w=Math.min(100,pct),exp=obj*elapsed/total,pace=exp?done/exp*100:0;
      const rest=Math.max(0,obj-done),per=Math.ceil(rest/left),[cls,lab]=statusOf(pace);
      return `<div class="prow"><div class="nm">${esc(nm)}<span>${t().objective} ${nf(obj)}</span></div>
        <div class="bar"><i style="width:${w.toFixed(1)}%;background:${barColor(pace)}"></i>
        <span class="tick" style="left:${Math.min(99,exp/obj*100).toFixed(1)}%" data-l="${t().expected} ${nf(exp)}"></span></div>
        <div class="fig">${nf(done)} <span class="pill ${cls}">${lab}</span><span>${t().left} ${nf(rest)} → ${nf(per)} ${t().perDay}</span></div></div>`;
    }).join("")+`</div><div class="note">${t().cumulNote}<br>${t().noteMg} ${t().mgPay}: <strong class="mono">${nf(c.mgPay)}</strong>
      &nbsp;·&nbsp; ${t().visa}: <strong class="mono">${nf(c.visa)}</strong> &nbsp;·&nbsp; ${t().avis}: <strong class="mono">${nf(c.avis)}</strong></div></div>`;
}
function renderTasks(){

   `<div class="shead"><h2>${t().tasks}</h2><span class="hint">${t().tasksHint}</span></div><div class="card p18">`;

    if(tk.w!==cur){if(cur)html+="</div>";cur=tk.w;html+=`<div class="wk"><h3>${esc(WEEKS[cur][lang])}</h3>`;}
    const id=mk+"-"+i, rec=taches[id]||{}, on=!!rec.done, lock=isLocked(id,tk.d);

      meta=`<span class="who"><span class="av" style="background:${u.color}">${esc(String(u.name)[0])}</span>${esc(u.name)}</span>`;}
    if(miss) meta=`<span class="pill p-bad">${t().missed}</span>`;
    else if(lock&&on) meta+=` <span class="pill p-ok">${t().done}</span>`;
    if(ME&&ME.admin&&lock) meta+=` <button class="btn ghost sm" data-un="${id}">${t().unlock}</button>`;
    html+=`<div class="task${on?" done":""}${miss?" miss":""}${tk.wk?" weekly":""}">
      <input type="checkbox" id="tk${i}" data-id="${id}" data-lbl="${esc(tk[lang]).slice(0,90)}"${on?" checked":""}${lock?" disabled":""}>

    const id=cb.dataset.id;
    const rec=cb.checked?{done:true,by:ME?ME.id:"?",at:new Date().toISOString()}:{done:false,by:ME?ME.id:"?",at:new Date().toISOString()};

let recog=null, recBase="";
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function stopMic(){ if(recog){try{recog.stop();}catch(e){} recog=null;}
  const b=document.getElementById("micbtn"); if(b){b.classList.remove("on");b.querySelector("span.lb").textContent=t().mic;} }
function startMic(){
  if(!SR)return;
  const ta=document.getElementById("rc-text"), sel=document.getElementById("rc-lang"), b=document.getElementById("micbtn");
  recog=new SR(); recog.lang=sel.value||"fr-FR"; recog.continuous=true; recog.interimResults=true;
  recBase=ta.value?ta.value.replace(/\s+$/,"")+" ":"";
  recog.onresult=e=>{let fin="",itm="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i]; if(r.isFinal)fin+=r[0].transcript+" "; else itm+=r[0].transcript;}
    if(fin)recBase+=fin;
    ta.value=clip(recBase+itm,2000);};
  recog.onend=()=>{ if(recog){recog=null; b.classList.remove("on"); b.querySelector("span.lb").textContent=t().mic;} };
  recog.onerror=()=>{ stopMic(); };
  try{recog.start(); b.classList.add("on"); b.querySelector("span.lb").textContent=t().listening;}catch(e){recog=null;}
}

  const blk=(ti,rows,neg)=>`<div class="card p18"><h3 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">${esc(ti)}</h3>`+
    rows.map(r=>`<div class="corr"><span>${esc(r[0])}</span><span class="v" style="color:${neg?"var(--bad)":"var(--ok)"}">${typeof r[1]==="number"?nf(r[1]):esc(r[1])}</span></div>`).join("")+`</div>`;
  document.getElementById("s-corr").innerHTML=`<div class="shead"><h2>${t().corr}</h2><span class="hint">${t().corrHint}</span></div>
    <div class="cols">${blk(t().mLost,CORR.mLost,true)}${blk(t().rDown,CORR.rDown,true)}${blk(t().rUp,CORR.rUp,false)}</div>`;
}
function renderAdmin(){
  const el=document.getElementById("s-admin");
  if(!ME||!ME.admin){el.innerHTML="";return;}
  el.innerHTML=`<div class="shead"><h2>${t().admin}</h2><span class="hint">${t().adminHint} · ${t().unlockHint}</span></div>
   <div class="card p18"><h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:12px">${t().users}</h3>
   <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">`+
   USERS.map((u,i)=>`<div><label>${t().uname}</label><input type="text" data-u="${i}" data-f="name" value="${esc(u.name)}" maxlength="24">
     <label style="margin-top:8px">${t().upin}</label><input type="text" inputmode="numeric" pattern="[0-9]*" data-u="${i}" data-f="pin" value="" placeholder="••••" maxlength="4"></div>`).join("")+
   `<div><button class="btn" id="usave">${t().usave}</button></div></div>
   <div class="note">${t().pinNote}</div></div>`;
  document.getElementById("usave").addEventListener("click",async()=>{
    const jobs=[];
    el.querySelectorAll("input[data-u]").forEach(inp=>{
      const u=USERS[+inp.dataset.u], f=inp.dataset.f, v=clip(String(inp.value).trim(),24);
      if(f==="pin"){ if(/^[0-9]{4}$/.test(v)) jobs.push(sha(SALT+v).then(h=>{u.h=h;})); }
      else if(v) u.name=v;});
    await Promise.all(jobs);
    if(DB){try{await DB.doc("config/users").set({list:USERS.map(u=>({id:u.id,name:u.name,h:u.h}))});}catch(e){}}
    logIt("users",""); renderAll();
  });
}
function renderAll(){renderStatic();renderToday();renderMonth();renderTasks();renderRecap();renderLog();renderYear();renderCorr();renderAdmin();}

document.getElementById("langsel").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  lang=b.dataset.l; try{localStorage.setItem("cs-lang",lang);}catch(_){}
  gateText(); renderAll(); renderEntry();
});
function setStatus(kind){
  const d=document.getElementById("dot"),s=document.getElementById("statxt");
  d.className="dot "+(kind==="live"?"on":kind==="local"?"off":"");
  s.textContent=kind==="live"?t().live:kind==="local"?t().local:t().wait;
}

gateText(); buildPad(); paintCells();
setTimeout(()=>document.getElementById("stage").classList.remove("intro"),480);

(async()=>{
  let db=null;
  try{ db=(window.claude&&claude.use)?await claude.use("db"):null; }catch(e){ db=null; }
  if(!db){ if(!document.getElementById("app").hidden) setStatus("local"); return; }
  DB=db;
  try{ const cfg=await db.doc("config/users").get();
    if(cfg.exists&&cfg.data()&&Array.isArray(cfg.data().list)&&cfg.data().list.length){
      const saved=cfg.data().list;
      USERS=DEFAULT_USERS.map(d=>{const s=saved.find(x=>x.id===d.id);return s?Object.assign({},d,{name:s.name||d.name,h:s.h||d.h}):d;});
    }}catch(e){}
  if(!document.getElementById("app").hidden) setStatus("live");
  const sub=(coll,fn)=>{try{db.collection(coll).onSnapshot(s=>{
    const o={}; s.docs.forEach(d=>{o[d.id]=d.data()||{};}); fn(o);},()=>{});}catch(e){}};
  sub("jours",o=>{jours=o; if(ME){renderToday();renderMonth();renderYear();}});
  sub("taches",o=>{taches=o; if(ME){renderTasks();renderLog();}});
  sub("mois",o=>{mois=o; if(ME){renderYear();renderToday();renderMonth();}});
  sub("journal",o=>{journal=o; if(ME)renderLog();});
  sub("unlocked",o=>{unlocked=o; if(ME)renderTasks();});
  sub("recap",o=>{recap=o; if(ME)renderRecap();});
  setTimeout(()=>{ if(ME) setStatus("live"); },300);
})();

if("serviceWorker" in navigator){ window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
